# Dependabot configuration for mj-agent
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Goal: catch action / dependency deprecations early (e.g. the Node.js 20
# deprecation that surfaced in PR #46 / fixed in PR #48) by letting
# Dependabot open weekly PRs against the develop branch.
#
# Scope (Phase 1 maintain):
#   - github-actions: bumps for actions/* + astral-sh/setup-uv used in
#     `.github/workflows/ci.yml` (PR #51 pinned them to commit SHA;
#     Dependabot bumps SHA + `# vX.Y.Z` comment together)
#   - docker: bumps for FROM image digests in `docker/Dockerfile`
#     and `image:` digests in `docker/compose.yaml` (PR #52 pinned
#     them to digest). Dependabot rewrites the image reference only —
#     any adjacent `# tag:` comment is hand-maintained (see #294).
#
# Out of scope (deferred):
#   - pip / uv ecosystem updates: Dependabot's uv support is still
#     evolving; we manage `uv.lock` manually via `uv sync` for now.
#     Revisit once Dependabot ships stable uv lock support OR after
#     Phase 2 plan picks up dependency hygiene as a track.

version: 2
updates:
  # ── GitHub Actions used in CI workflows ──────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    target-branch: "develop"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      # Commit type is `infra` (STANDARD §3), NOT `maintain` — that is a
      # branch type, and STANDARD §5.1 keeps the two namespaces distinct
      # precisely to stop this collapse. `include: scope` appends
      # Dependabot's own scope, so the rendered subject is
      # `infra(deps): bump ...` (`deps` is a §4.2 scope). Applies to all
      # three ecosystem blocks below.
      prefix: "infra"
      include: "scope"
    # Keep major version bumps gated behind manual review (security +
    # breaking-change scrutiny). Minor / patch can auto-merge once
    # we add a workflow for that (Phase 2). Patch / minor still go
    # through CI which is now mandatory (PR #46).
    pull-request-branch-name:
      separator: "/"
    # Group all minor/patch bumps into one PR per week to avoid PR
    # churn; majors remain individual PRs because each carries
    # potentially breaking changes worth reviewing in isolation.
    groups:
      gha-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ── Dockerfile FROM image digests ────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    target-branch: "develop"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "infra"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Guard (#294): the python base-image minor is LOCKED. pyproject
    # requires-python >=3.13,<3.14 + UV_PYTHON_PREFERENCE=only-system
    # mean a 3.14+ base can never satisfy uv.lock — the build dies at
    # `uv sync` ("No interpreter found for Python ==3.13.*"). Only
    # same-tag digest bumps may flow; a major/minor jump needs a human
    # PR that moves requires-python + uv.lock in the same change.
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # ── docker-compose service image digests ─────────────────────────
  # Note: Dependabot's `docker-compose` ecosystem watches `image:` lines
  # in compose files. Same digest-pinning convention as Dockerfile FROM.
  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    target-branch: "develop"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "infra"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    groups:
      compose-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    # Guard (#433): the two FIRST-PARTY images in docker/compose*.yml are built
    # by this repo, are never published to a registry Dependabot can reach, and
    # must not be tracked for updates at all:
    #   - docker/compose.yaml           `mj-agent:0.1` — no registry prefix, so
    #     Dependabot resolves it against Docker Hub as `library/mj-agent` → 401
    #     UNAUTHORIZED (the image does not exist there; it is a local build).
    #   - docker/compose.{test,prod}.yml `8.135.38.175/mj-agent/mj-agent:0.1` —
    #     private Harbor, unreachable from GitHub-hosted runners →
    #     `private_source_timed_out`.
    # Either one makes the whole `docker_compose in /docker` job exit non-zero
    # even though it still opens correct PRs for the third-party service images
    # (the DB / cache services in docker/compose.yaml). A permanently
    # red Dependabot job is precisely how the #294 base-image breakage stayed
    # hidden for 8 weeks — see the same ignore convention in the `docker` block
    # above, this is that convention applied here, not a new mechanism.
    #
    # NOTE on the names below: Dependabot strips the registry into the
    # dependency's `source` field, so the Harbor image is named
    # `mj-agent/mj-agent` — NOT `8.135.38.175/mj-agent/mj-agent`. Verified in the
    # log of run 30980823108: `Handled error whilst updating mj-agent/mj-agent:
    # private_source_timed_out {source: "8.135.38.175"}`. Naming it with the
    # registry prefix would silently never match and leave the job red.
    # The third-party service images are deliberately NOT listed below — they
    # resolve fine and must keep receiving update PRs. Keeping their names out
    # of this block also keeps the #433 AC-4 grep check ("the ignore section
    # names neither service image") truthful as literally written.
    ignore:
      - dependency-name: "mj-agent"
      - dependency-name: "mj-agent/mj-agent"
