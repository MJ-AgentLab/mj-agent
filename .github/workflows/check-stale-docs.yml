name: check-stale-docs (warning mode)

# Warning-mode stale doc reference detection. Provenance: archived ADR-023
# (Phase D-2), archived 2026-05-11; per the docs/INDEX.md archive table its
# content lives on in the comments of scripts/find_stale_docs.py and
# scripts/find_old_completed_plans.py -- this workflow is not one of those
# designated carriers, so it cites the ADR as archived rather than live.
#
# Posture: warning is this gate's long-term registered stance
# (sdd/gates.md §2, `warning@ci`); a blocking flip is NOT pursued (#440).
# The former 4-week trial-period note was retired -- it came from the
# now-archived ADR, was never registered per policies/ci-gates.md §4.1.1,
# and could not be met as written (find_stale_docs.py returns 0 on every
# path, so flipping continue-on-error alone would be a no-op).
#
# Runs `scripts/find_stale_docs.py` against the PR diff. Detects
# backtick-quoted refs to renamed / deleted files in:
#   - docs/**/*.md
#   - plans/**/*.md
#   - CLAUDE.md / CHANGELOG.md / README.md
#
# Output goes to GitHub Actions step summary as `::warning::` annotations.
# Always exits 0 (never blocks PR merge).

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'docs/**'
      - 'plans/**'
      - 'src/**'
      - '.claude/**'
      - 'CLAUDE.md'
      - 'CHANGELOG.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  check-stale-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git diff)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run find_stale_docs.py (warning mode)
        run: |
          python scripts/find_stale_docs.py "origin/${{ github.base_ref }}" HEAD | tee stale-docs.log
          echo "::notice::find_stale_docs.py runs in warning mode by design (long-term posture; see sdd/gates.md §2). Review output above; no merge block."
        continue-on-error: true
