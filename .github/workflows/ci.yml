name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - 'feature/*'
      - 'bugfix/*'
      - 'documentation/*'
      - 'maintain/*'
      - 'hotfix/*'

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      # Action references below are pinned to commit SHA + version comment
      # (supply-chain hardening). Dependabot recognises the `# vX.Y.Z` comment
      # and bumps SHA + comment together when upstream publishes new versions.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Python version
        id: pyver
        shell: bash
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Syntax check (compileall)
        # Scope to project code dirs. `compileall -q .` would recurse into
        # .venv/ and try to compile third-party Py2-only files (e.g.
        # gherkin-official ships count_symbols_py2.py with `ur'...'` Py2 syntax
        # that fails Py3 SyntaxError; runtime version-gated so not actually
        # loaded, but compileall doesn't know that). Match ruff/mypy scope.
        run: uv run python -m compileall -q src tests scripts

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type check (mypy strict)
        run: uv run mypy src/mj_agent

      - name: Frontmatter schema (canonical docs)
        # Locks down Phase 1 末 governance: all canonical docs declare
        # explicit track + required base fields. See scripts/check_frontmatter.py
        # for schema; non-zero exit on any violation.
        run: uv run python scripts/check_frontmatter.py

      - name: Wikilinks (canonical docs)
        # Belt-and-suspenders alongside the frontmatter validator: catches
        # broken `[[...]]` references that mypy / ruff / pytest can't see.
        # MJ_AGENT_A4_STRICT=1 makes the root-file A4 link resolution
        # (#267 items 1-2) BLOCKING instead of warning-mode — a deliberate
        # ci-blocking-gate-toggle (owner-approved; baseline was clean at flip).
        env:
          MJ_AGENT_A4_STRICT: "1"
        run: uv run python scripts/check_wikilinks.py

      - name: Kernel section refs (execution-loop)
        # Third doc-integrity validator (#453). check_wikilinks.py deliberately
        # SKIPS `#anchor` fragments and these `§N.M` citations are plain prose,
        # not wikilinks — so nothing saw 66 references pointing at kernel
        # sections that do not exist (execution-loop §4 changed meaning during
        # the M6 PR4 refactor: HITL_Prompt's per-stage prompts §4.1-§4.15 were
        # NOT re-ported, and kernel §4 is now the Stage → Skill map).
        # WARNING-FIRST (continue-on-error) — a NEW warning gate is not a
        # posture flip (#444 判例), so no ci-blocking-gate-toggle 拍板 applies.
        # A blocking flip is a CANDIDATE, deliberately NOT pursued here and
        # therefore NOT registered under policies/ci-gates.md §4.1.1; per that
        # section the only consequence is that a future flip falls back to the
        # §4 "Gate 启用前" evidence standard (1-week DRI dry-run) instead of the
        # streak-based absorption. Flip axis would be this step's
        # continue-on-error: true→false (no --fail-on threshold axis).
        continue-on-error: true
        run: uv run python scripts/check_loop_section_refs.py

      - name: A6 audit schema (evidence/ai-context-audit)
        # Durability gate (#359 / #347 §三.2): the evidence/ai-context-audit/
        # quarterly A6 audit snapshots use SCHEMA.md §2's own frontmatter schema
        # (type: ai-context-audit + cycle/auditor/scope/findings_summary/
        # content_hash_snapshot) and live OUTSIDE check_frontmatter.py SCAN_ROOTS,
        # so this dedicated validator enforces the §2 schema. BLOCKING day-1 — the
        # ci-gates.md §4:41 "1-week dry-run before blocking" is explicitly WAIVED by
        # the Owner (2026-07-20; Q2/Q3 already compliant + structural-only checks +
        # tiny controlled corpus + zero drift risk). This is NOT the D-016 信任面
        # exemption (that is MCP-projection-only); it is an ad-hoc ci-blocking-gate-
        # toggle waiver whose execution record lives in PR / issue #359 (analogous
        # to V11 day-1 blocking #330). Validates STRUCTURE only — does NOT recompute
        # hashes or match the time-varying §2.1 face-set (that drift is what the
        # NEXT quarterly audit detects; the derivation is a `--derive` authoring
        # aid, not a gate). See scripts/check_ai_context_audit.py.
        run: uv run python scripts/check_ai_context_audit.py

      - name: No cross-repo refs (forward guard)
        # Forward guard after 2026-05 cross-repo decoupling cleanup. Scans
        # docs/**/*.md + CLAUDE.md + README.md for forbidden `mj-system` /
        # `派生自` patterns, with allow-list for code-layer literals
        # (Docker network names, env var namespaces, MCP server identifiers)
        # + glossary exemption. See scripts/check_no_cross_repo_refs.py
        # for the allow-list and rationale.
        run: uv run python scripts/check_no_cross_repo_refs.py

      - name: Old completed plans (warning-mode GC候选)
        # Plan §3.2 修订 5 / archived ADR-023. Surfaces plans/[PLAN]_*.md
        # with state: completed AND updated >= 180 days ago — candidates for
        # Phase D 物理归档 (plans/archive/ subdir; per Meta v2.2 §5.11.5).
        # Always exits 0 (warning-mode); manual maintainer review.
        run: uv run python scripts/find_old_completed_plans.py

      # ===== Spec-Anchored Refactor G1/G2/G9 — Phase M3 real impl + Stage C flip =====
      # M3 real impl landed via M3-FU-G1G2G9-IMPL; Stage C C-a flipped to BLOCKING
      # (all 3 gates empirically clean: 5P/0W/0F + 5P/0W/0F + 1P/0W/0F).

      - name: 'G1 capability schema (BLOCKING per Stage C C-a; 5P/0W/0F clean)'
        run: uv run python scripts/sdd/check_capability_schema.py --all

      - name: 'G2 traceability (BLOCKING per Stage C C-a; 5P/0W/0F clean)'
        run: uv run python scripts/sdd/check_traceability.py --all

      - name: 'G9 INDEX idempotency (BLOCKING per Stage C C-a; --check matches committed)'
        run: uv run python scripts/sdd/generate_index.py --check

      # ===== End of G1/G2/G9 Stage C block =====

      # ===== Spec-Anchored Refactor — archive catch-gates =====
      # G11/G12 BLOCKING since M6 PR4-flip (owner-gated ci-blocking-gate-toggle, option (c),
      # 2026-06-05). archive/ populated by the M6 PR4 ceremony (#229 tri-track + #231 consol);
      # pre-flight: check_archive_manifest --all --strict = 2P/0W/0F exit 0 verified before flip.
      # G14/G15 + G17 remain WARNING (continue-on-error) — G14/G15 forward-ref WARNs to the
      # not-yet-built archive/legacy/ + archive/capabilities/ subtrees (18 as-of completion-audit
      # PR2; count drifts with prose edits — step output is the SoT); their blocking flip is
      # tracked as M6-FU-G14G15-BLOCKING-FLIP (build subtrees / rework refs first). Toggling a
      # blocking gate is a HITL action (policies/ai-agent.md §4 ci-blocking-gate-toggle).

      - name: 'G11/G12 archive manifest (BLOCKING per M6 PR4-flip; archive/ populated #229/#231)'
        continue-on-error: false
        run: uv run python scripts/sdd/check_archive_manifest.py --all --strict

      - name: 'G14/G15 archived references (WARNING — M6-FU-G14G15-BLOCKING-FLIP: archive/legacy + archive/capabilities forward-refs pending)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_archived_references.py --all

      - name: 'archive/INDEX.md idempotency (WARNING per M5-PR0; no-op until archive/ born in move PRs)'
        continue-on-error: true
        run: uv run python scripts/sdd/generate_archive_index.py --check

      # ===== End of M5-PR0 archive catch-gate block =====

      # ===== Spec-Anchored Refactor Phase M3 Stage C — adapter validators (post C-a flip) =====
      # Per Phase M3 Stage C C-a flip strategy (kickoff Gate-1 approved):
      # V1 / V3 / V5 flipped to BLOCKING (empirical clean state — see commit body for
      # reverify outputs). V2 / V4 / V6 kept warning (deferred per plan rationale).

      - name: 'V1 python contracts (BLOCKING per Stage C C-a; 9P/11W/0F clean)'
        run: uv run python scripts/sdd/check_python_contracts.py --all

      - name: 'V2 agent contracts (warning; SKIP-CLEAN no contracts; Phase 2+ when agent.contract.yml lands)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_agent_contracts.py --all

      - name: 'V3 prompt contracts (BLOCKING per Stage C C-a; 1P/1W/0F clean post M3-FU-VALIDATOR-CONTRACT-ALIGN)'
        run: uv run python scripts/sdd/check_prompt_contracts.py --all

      - name: 'V4 claude-skill contracts (BLOCKING per M3-FU-V4-SKILLS-COMPLETE; full-scan, count SoT = validator output)'
        run: uv run python scripts/sdd/check_claude_skill_contracts.py --all

      - name: 'V5 docker contracts (BLOCKING per Stage C C-a; 2P/4W/0F clean post M3-FU-V5-SUBFLAGS)'
        run: uv run python scripts/sdd/check_docker_contracts.py --all --bdd --tdd --compose-config

      - name: 'V6 runtime expected (warning; SKELETON BY DESIGN; Phase M4 full probe implementation)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_runtime_expected.py --all

      # ===== End of Phase M3 Stage C adapter gate block =====

      # ===== Spec-Anchored Refactor Phase M3 — runtime-skill validator (M3-FU-RUNTIME-SKILL-VALIDATOR) =====
      # V7 separates runtime-skill.contract.yml (SKILL.md body freeze) from V6
      # runtime.expected.yaml (docker container probe). Flipped to BLOCKING per
      # Stage C C-a (3P/0W/0F clean).
      - name: 'V7 runtime-skill contracts (BLOCKING per Stage C C-a; 3P/0W/0F clean)'
        run: uv run python scripts/sdd/check_runtime_skill_contracts.py --all

      # ===== End of Phase M3 Stage C V7 block =====

      # ===== Spec-Anchored Refactor Phase M4 Stage D D-1 — G8 evidence-required =====
      # G8 trigger semantic (per most-specific-SoT sdd/lifecycle.md L69):
      # "verifying → active | evidence 写入 + trace.yml 链路完整 | G8 evidence required (Phase M4 起 blocking)".
      # Validator fires only when capability `lifecycle_state == "active"`; otherwise SKIPs.
      # All 5 pilots currently `lifecycle_state: drafting` → 5SKIP baseline at landing;
      # enforcement activates as capabilities mature per state machine (tracked by
      # M4-FU-CAPABILITY-STATE-EVOLVE-PILOTS).
      - name: 'G8 capability evidence required (BLOCKING per Stage D D-1; 4P/0W/0F/1SKIP per current pilot state)'
        run: uv run python scripts/sdd/check_capability_evidence_required.py --all

      # ===== End of Phase M4 Stage D D-1 G8 block =====

      # ===== Spec-Anchored Refactor Phase M4 Stage D D-2 — G19 BDD scenario trace =====
      # Per gates.md L58 (most-specific row authoritative; L96 omits G19 row):
      # "G19 | check_bdd_scenario_trace.py | 关键 scenario 绑定 REQ/CTR | M3 warning / M4 blocking"
      # Per gates.md L51: same script via --scope docker for L51 docker-bdd-scenario-check subset.
      # R-N v8 R-1 Decision Matrix (supersedes R-N v7 R-1; D-2 Step 5 escalation lock-in):
      # TAG layer (validator concern) = FAIL on @REQ/@CTR missing;
      # TRACE layer (maintenance concern) = WARN on trace.yml bdd 层 mapping gap;
      # healthy = PASS. Dry-run baseline: 16P/1W/0F (1 WARN = llm-provider/REQ-003
      # trace gap; M4-FU-LLM-PROVIDER-TRACE-YML-BDD-COMPLETE).
      - name: 'G19 BDD scenario trace (BLOCKING per Stage D D-2; 17P/0W/0F post completion-audit PR1)'
        run: uv run python scripts/sdd/check_bdd_scenario_trace.py --all --scope full

      # ===== End of Phase M4 Stage D D-2 G19 block =====

      # ===== Spec-Anchored Refactor Phase M4 Stage D D-3 — G21 BDD acceptance =====
      # Per gates.md L60 + L96 ("G21/G22 启用" mode-unqualified → WARNING per outline
      # §3 v2 + Phase M3 L95 G19/G20 warning precedent). Authoritative scope spec
      # per sdd/adapters/bdd-tdd.md L161: "@risk:high / @risk:critical scenario 必含
      # pass_rate: 1.0 或 justification".
      # R-N v9 R-9-1 filter: @risk:critical OR @risk:high (15 scenarios across 4 pilots;
      # mcp-server-governance medium-only excluded).
      # R-N v9 R-9-2 4-layer policy: (a) risk filter precondition + (b) TAG layer FAIL
      # per R-N v8 R-1 inherit + (c) TRACE layer WARN per R-N v8 R-1 inherit +
      # (d) EVIDENCE pass_rate DEFERRED to M-FU#4 Stage E α'.
      # Dry-run baseline: 14P/1W/0F (1W = llm-provider/REQ-003 cross-gate inheritance
      # from D-2 G19 M-FU#1 trace curation gap).
      # ===== Stage E α' E-1 flip (this PR): WARNING → BLOCKING =====
      # Mechanism: --strict (exit 1 on WARN per _common/cli.py exit_code) + continue-on-error:false.
      # Post-E-0b (#198 merged) baseline: 15P/0W/0F. A future unjustified @risk:critical|high
      # scenario → WARN → --strict exit 1 → blocks. (Severity NOT reclassified; per E-1/E-2 decision.)
      - name: 'G21 BDD acceptance (BLOCKING per Stage E E-1; @risk:critical|high subset; 15P/0W/0F post-E-0b)'
        continue-on-error: false
        run: uv run python scripts/sdd/check_bdd_acceptance.py --all --strict

      # ===== End of Phase M4 Stage D D-3 G21 block =====

      # ===== Spec-Anchored Refactor Phase M4 Stage D D-4 — G22 BDD unautomated justification =====
      # Per gates.md L61 + L96 + sdd/adapters/bdd-tdd.md L120-122 (G22 strict spec:
      # @risk:critical|high 未自动化 scenario → runbook.md 必含 justification 段落
      # with 4 fields: 原因 / 替代验证手段 / 升级触发条件 / 预计时间).
      # R-N v10 R-10-1 mode: WARNING during Stage D — phased rollout per outline §4
      # R-1'' (L121 "M4 blocking" = BLOCKING by M4 END via Stage E α' flip per M-FU#6;
      # Stage D WARNING is designed phased step; R-10-8 documented NOT spec deviation).
      # R-N v10 R-10-2 predicate: automation_status:unautomated filter + runbook.md
      # 4-field MVP keyword presence check; WARN-only on missing.
      # R-N v10 R-10-6 policy: STRUCTURAL FAIL (defensive; expected NOT triggered per
      # §0 #3 — 5/5 pilots have automation_status field) + CURATION WARN (missing
      # justification) + 4-field full PASS.
      # Dry-run baseline: 0P/14W/0F (15 critical|high × unautomated, 1 "absorbed" by
      # M-FU#1 trace gap; G19+G21+G22 cross-gate inheritance reinforces M-FU#1+M-FU#7
      # priority; exit 0 per WARNING mode).
      # ===== Stage E α' E-2 flip (this PR): WARNING → BLOCKING =====
      # Mechanism: --strict + continue-on-error:false (same as E-1; G21+G22 share R-15-1 runbook source).
      # Post-E-0b (#198 merged) baseline: 15P/0W/0F. Post completion-audit PR1
      # automation_status truth-up: 4P/0W/0F (unautomated critical|high set narrowed
      # to safe-sql REQ-004 + docker-compose x3; smaller P-count = honest signal, not a gate relax).
      - name: 'G22 BDD unautomated justification (BLOCKING per Stage E E-2; @risk:critical|high × unautomated runbook.md check; 4P/0W/0F post completion-audit PR1 truth-up)'
        continue-on-error: false
        run: uv run python scripts/sdd/check_bdd_unautomated.py --all --strict

      # ===== End of Phase M4 Stage D D-4 G22 block =====

      # ===== Spec-Anchored Refactor Phase M4 Stage D D-5 — G23 + G24 TDD pair (FINAL unit) =====
      # Per gates.md L62-L63 + L96 + sdd/adapters/bdd-tdd.md L197-199:
      # L62 G23 | check_tdd_test_list.py | 高风险 task 有 tdd.test_list | M4 warning / M6 blocking
      # L63 G24 | 同 G23（bugfix-regression）| bugfix PR 必有 regression test | M4 blocking
      # R-N v12 R-12-1 single script + subflag dispatch (V5 precedent).
      # R-12-2 G23 WARNING (per L62 M4 warning/M6 blocking phased designed).
      # R-12-3 G24 BLOCKING immediate (per L63+L198 most-specific-SoT;NOT R-10-8 transplant
      # — outline §4 R-1'' covers G21/G22 only, NOT G23/G24).
      # R-12-4 G24 branch-conditional: bugfix/* fires; else SKIP (per L198).
      # R-12-9 G24 fire-path 强制 unit-test coverage (bugfix PASS/missing FAIL/non-bugfix SKIP).
      # Dry-run baseline: G23 15P/5W/0F (5W = M-FU#9 ACTIVATED tasks curation surface) +
      # G24 0P/0W/0F SKIP (non-bugfix branch).
      - name: 'G23 TDD test_list (warning per Stage D D-5; tasks.md critical|high check; 15P/5W/0F per R-N v12 R-12-2)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_tdd_test_list.py --check g23 --all
      - name: 'G24 bugfix regression (BLOCKING per Stage D D-5; branch-conditional SKIP on non-bugfix; R-N v12 R-12-3)'
        run: uv run python scripts/sdd/check_tdd_test_list.py --check g24 --all

      # ===== End of Phase M4 Stage D D-5 G23+G24 block =====
      # ===== Stage D FINAL unit closure: D-1 G8 + D-2 G19 + D-3 G21 + D-4 G22 + D-5 G23/G24 all landed =====

      # ===== Post-M6 completion-audit PR2 — G3 / G7 real impl + G25 subflag (M6-FU-GATES-TRUTH-UP) =====
      # All three land in WARNING mode (continue-on-error: true). Blocking flips
      # are separate ci-blocking-gate-toggle HITL actions (policies/ai-agent.md §4).
      # G3: contracts/ non-empty + *.contract.yml parse + behavior.feature for
      #     critical|high REQs (replaces M0 skeleton). Baseline 5P/0W/0F.
      # G7: decrypted artifacts (.env / config/secrets*.conf / *.pem / *.key) not
      #     tracked + .gitignore pins + docker build-context exposure. Baseline
      #     3P/0W/0F since the owner-approved root .dockerignore (2026-06-11
      #     follow-up; validator also verifies its secrets-conf coverage).
      # G25: changed src/mj_agent **.py without tests/ change → WARN; fires only
      #     in PR context (GITHUB_BASE_REF/HEAD_REF); SKIPs on push runs.
      - name: 'G3 contracts (warning at landing; real impl per completion-audit PR2; 5P/0W/0F)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_contracts.py --all

      - name: 'G7 secret exposure (warning; 4P/0W/0F since S2 #330 codex-config check; completion-audit PR2 + follow-up)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_secret_exposure.py --all

      - name: 'G25 changed-code-has-test (warning; PR-context only, SKIP on push; completion-audit PR2)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_tdd_test_list.py --check g25 --all

      # ===== End of completion-audit PR2 G3/G7/G25 block =====

      # ===== dual-agent-compat — V8/V9/V10/V11 manifest + projection gates (#320, #326, #330) =====
      # V8/V9/V10 are BLOCKING (continue-on-error: false) since the P4 dual-axis flip
      # (#399, 2026-08-03); they landed warning-first per D-009 and were flipped only
      # after the §11.2 observation window closed. Owner ci-blocking-gate-toggle
      # execution records: one per gate (policies/ai-agent.md §4), issue #399.
      # Eligibility (plan §11.2 four criteria, measured 2026-08-03): anchor 2026-07-14
      # +20d (gate 07-28); consecutive-clean streaks V8/V9 = 55, V10 = 49 (both >= 20);
      # zero waiver; ledger = evidence/ai-context-audit/2026-07_ci_audit.md.
      # V11 was BLOCKING from day 1 per D-016 (trust surface takes no observation
      # period) — Owner execution record in #330 (2026-07-14).
      # V8/V9 now run at --fail-on warning (threshold axis, plan §11.2(1); for V9 this
      # is an ADDED flag — the script's argparse default is "error");
      # V10/V11 are `agents_sync.py --check` per surface (no --fail-on; exit 1 on drift).
      # Step output is the SoT for counts. NOTE: real-tree pins in tests/unit
      # (test_real_tree_* / test_real_tree_projection_in_sync /
      # test_real_tree_mcp_projection_in_sync) make the same invariants effectively
      # enforced by the blocking Tests step — declared in sdd/gates.md §2
      # (V8/V9/V10/V11 rows share this property by design).
      # V8: manifest schema/enums/required coverage + AGENTS.md x5 entry relations +
      #     canonical-10 drift guard + stats-from-manifest. Baseline 0E/0W.
      # V9: projection closure (Handoff out-edges; warning at S0 empty state) +
      #     full reconcile + lock consistency (skills PJ0xx + codex-config PJ04x incl.
      #     PJ044 never-tier leak). Baseline 0E/0W (S1 closure closed #326; S2 mcp
      #     surface landed #330).
      # V10: agents_sync SKILLS drift gate (regenerate-and-diff; LF-normalized) —
      #     generated .agents/** + skill lock entries must match sources/template
      #     (D-012: artifacts are generator-owned; hand edits and source edits without
      #     re-running `agents_sync.py sync` both go red). Baseline clean (S1, #326).
      # V11: agents_sync MCP drift gate (--surface mcp) — generated .codex/config.toml
      #     + reserved lock key must match .mcp.json x manifest mcp tiers + codex.posture
      #     (emitter B, S2 #330). Zero env/secret parsing at generation and check time,
      #     so forks / no-secrets environments cannot false-red.
      - name: 'V8 dual-agent manifest (BLOCKING since P4 #399; 0E/0W)'
        continue-on-error: false
        run: uv run python scripts/sdd/check_development_agent.py --all --fail-on warning

      - name: 'V9 agents projection (BLOCKING since P4 #399; S1 closure; S2 PJ04x; 0E/0W)'
        continue-on-error: false
        run: uv run python scripts/sdd/check_agents_projection.py --all --fail-on warning

      - name: 'V10 agents_sync skills drift (BLOCKING since P4 #399/S3; surface=skills; clean)'
        continue-on-error: false
        run: uv run python scripts/sdd/agents_sync.py --check --surface skills

      - name: 'V11 codex MCP projection drift (BLOCKING day-1 per D-016; Owner record #330)'
        run: uv run python scripts/sdd/agents_sync.py --check --surface mcp

      # ===== End of dual-agent-compat V8/V9/V10/V11 block =====

      - name: Tests (unit + eval + integration; smoke + contract + bdd excluded by default)
        # `pyproject.toml` pins addopts = "-m 'not smoke and not contract'", so
        # this runs unit + eval + integration. External legs are always
        # structured policy skips; credentials never enable them. BDD scenarios
        # are run by the dedicated step below.
        run: uv run --frozen --no-sync python scripts/sdd/run_offline_pytest.py tests --ignore tests/bdd

      - name: 'BDD scenarios (BLOCKING per Stage C C-a; hardened offline runner)'
        # Phase M3 Stage B (M3-FU-BDD-TDD-RESTORE landing) + Stage C flip.
        # tests/bdd/ contains 5 capability subdirs × N scenarios bound via
        # pytest-bdd against each capabilities/*/contracts/behavior.feature.
        # Live/external scenarios are unconditional structured policy skips
        # (SKIP does not count as FAIL).
        run: uv run --frozen --no-sync python scripts/sdd/run_offline_pytest.py tests/bdd -q

      - name: Contract tests (offline; synthetic snapshot fixtures)
        # tests/contract/* is selected by the `contract` pytest marker. Since #499 PR-0c
        # the band no longer takes a `live_db` credential gate: it asserts catalog / SKILL
        # claims against synthetic sanitized-snapshot fixtures and therefore RUNS FOR REAL
        # here (it used to session-skip in full, verifying nothing). Pytest still never
        # opens a biz-live route — the scripts under test import no DB client at all.
        # NOTE: name/comment only were touched by PR-0c; posture is unchanged (no
        # continue-on-error flip, no new gate), so no ci-blocking-gate-toggle applies.
        run: uv run --frozen --no-sync python scripts/sdd/run_offline_pytest.py tests/contract -m contract

