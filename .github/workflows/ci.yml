name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - 'feature/*'
      - 'bugfix/*'
      - 'documentation/*'
      - 'maintain/*'
      - 'hotfix/*'

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      # Action references below are pinned to commit SHA + version comment
      # (supply-chain hardening). Dependabot recognises the `# vX.Y.Z` comment
      # and bumps SHA + comment together when upstream publishes new versions.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read Python version
        id: pyver
        shell: bash
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ steps.pyver.outputs.version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Sync dependencies
        run: uv sync --frozen || uv sync

      - name: Syntax check (compileall)
        run: uv run python -m compileall -q .

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type check (mypy strict)
        run: uv run mypy src/mj_agent

      - name: Frontmatter schema (canonical docs)
        # Locks down Phase 1 末 governance: all canonical docs declare
        # explicit track + required base fields. See scripts/check_frontmatter.py
        # for schema; non-zero exit on any violation.
        run: uv run python scripts/check_frontmatter.py

      - name: Wikilinks (canonical docs)
        # Belt-and-suspenders alongside the frontmatter validator: catches
        # broken `[[...]]` references that mypy / ruff / pytest can't see.
        run: uv run python scripts/check_wikilinks.py

      - name: No cross-repo refs (forward guard)
        # Forward guard after 2026-05 cross-repo decoupling cleanup. Scans
        # docs/**/*.md + CLAUDE.md + README.md for forbidden `mj-system` /
        # `派生自` patterns, with allow-list for code-layer literals
        # (Docker network names, env var namespaces, MCP server identifiers)
        # + glossary exemption. See scripts/check_no_cross_repo_refs.py
        # for the allow-list and rationale.
        run: uv run python scripts/check_no_cross_repo_refs.py

      - name: Old completed plans (warning-mode GC候选)
        # Plan §3.2 修订 5 / archived ADR-023. Surfaces plans/[PLAN]_*.md
        # with state: completed AND updated >= 180 days ago — candidates for
        # Phase D 物理归档 (plans/archive/ subdir; per Meta v2.2 §5.11.5).
        # Always exits 0 (warning-mode); manual maintainer review.
        run: uv run python scripts/find_old_completed_plans.py

      # ===== Spec-Anchored Refactor G1/G2/G9 — Phase M3 real impl (ADR-031) =====
      # Replaces M0 skeletons under M3-FU-G1G2G9-IMPL (Phase M3 Stage A).
      # G1/G2/G9 stay warning at M3; M4 toggles blocking per sdd/gates.md §5
      # blueprint schedule.

      - name: 'G1 capability schema (warning; REAL IMPL Phase M3 per M3-FU-G1G2G9-IMPL)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_capability_schema.py --all

      - name: 'G2 traceability (warning; REAL IMPL Phase M3 per M3-FU-G1G2G9-IMPL)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_traceability.py --all

      - name: 'G9 INDEX idempotency (warning; --check vs committed capabilities/INDEX.auto.md)'
        continue-on-error: true
        run: uv run python scripts/sdd/generate_index.py --check

      # ===== End of G1/G2/G9 M3 real impl gates =====

      # ===== Spec-Anchored Refactor Phase M2 — 6 adapter contract validators (E3β) =====
      # Stage A 6 adapter validators in warning-only mode (per Phase M2 §3.4 partial
      # completion path E3β + Stage E pre-outline reverify status table).
      # Known baseline noise documented inline per validator (3 REAL / 1 SMOKE-ONLY /
      # 1 BROKEN / 1 SKELETON-BY-DESIGN; tracked via M3-FU plans).

      - name: 'V1 python contracts (warning; REAL IMPL per Stage E reverify)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_python_contracts.py --all

      - name: 'V2 agent contracts (warning; SMOKE-ONLY at M1 end; ready for future)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_agent_contracts.py --all

      - name: 'V3 prompt contracts (warning; REAL IMPL; expected 1 FAIL noise on Stage C #3 per M3-FU-VALIDATOR-CONTRACT-ALIGN)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_prompt_contracts.py --all

      - name: 'V4 claude-skill contracts (warning; BROKEN; expected ~34 spurious WARN per H2 parser bug under M3-FU-V4-VALIDATOR-INVESTIGATE)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_claude_skill_contracts.py --all

      - name: 'V5 docker contracts (warning; REAL IMPL 5.1 + 5.2 sub-flags per M3-FU-V5-SUBFLAGS)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_docker_contracts.py --all --bdd --tdd --compose-config

      - name: 'V6 runtime expected (warning; SKELETON BY DESIGN; Phase M4 full probe implementation)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_runtime_expected.py --all

      # ===== End of Phase M2 E3β warning gates =====

      # ===== Spec-Anchored Refactor Phase M3 — runtime-skill validator (M3-FU-RUNTIME-SKILL-VALIDATOR) =====
      # V7 separates runtime-skill.contract.yml (SKILL.md body freeze) from V6
      # runtime.expected.yaml (docker container probe). Phase M3 warning mode;
      # Phase M4 strict per gate matrix.
      - name: 'V7 runtime-skill contracts (warning; REAL IMPL; Phase M3 landing)'
        continue-on-error: true
        run: uv run python scripts/sdd/check_runtime_skill_contracts.py --all

      # ===== End of Phase M3 warning gates =====

      - name: Tests (unit + eval + integration; smoke + contract excluded by default)
        # `pyproject.toml` pins addopts = "-m 'not smoke and not contract'", so
        # this runs unit + eval + integration. The integration suite session-
        # skips cleanly when POSTGRES_ANALYST_USER is unset (CI's case).
        run: uv run pytest

      - name: Contract tests (skip on missing analyst creds)
        # tests/contract/* is gated by the `contract` pytest marker AND the
        # `live_db` session fixture (skip when POSTGRES_ANALYST_USER unset).
        # CI runs without DB creds → tests skip cleanly; locally with .env
        # provisioned the same command exercises the contract.
        run: uv run pytest tests/contract -m contract
