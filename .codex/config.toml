# Native project candidate. Direct maintenance remains Owner-gated.
# Only existing project MCP servers; no user, plugin or connector import.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 65536

[mcp_servers.github]
command = "cmd"
args = ["/c", "npx", "-y", "@modelcontextprotocol/server-github"]
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]

[mcp_servers.playwright]
command = "cmd"
args = ["/c", "npx", "-y", "@playwright/mcp@latest"]

[mcp_servers.serena]
command = "cmd"
args = ["/c", "uv", "tool", "run", "--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex", "--enable-web-dashboard", "false", "--project-from-cwd"]

[mcp_servers.pg-mj-agent-memory-dev]
command = "pwsh"
args = ["-NoProfile", "-Command", "$r = & git rev-parse --show-toplevel 2>$null; if ($LASTEXITCODE -ne 0 -or -not $r) { exit 2 }; & (Join-Path $r 'scripts/mcp/pg-server-start.ps1') 'MJ_AGENT_PG_MEMORY_DEV_URL'; exit $LASTEXITCODE"]
env_vars = ["MJ_AGENT_PG_MEMORY_DEV_URL"]

[mcp_servers.pg-mj-agent-memory-test-lan]
command = "pwsh"
args = ["-NoProfile", "-Command", "$r = & git rev-parse --show-toplevel 2>$null; if ($LASTEXITCODE -ne 0 -or -not $r) { exit 2 }; & (Join-Path $r 'scripts/mcp/pg-server-start.ps1') 'MJ_AGENT_PG_MEMORY_TEST_LAN_URL'; exit $LASTEXITCODE"]
env_vars = ["MJ_AGENT_PG_MEMORY_TEST_LAN_URL"]

