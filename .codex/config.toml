env_vars = ["MJ_AGENT_PG_MEMORY_TEST_WAN_URL"]

[mcp_servers.pg-mj-agent-memory-prod-lan]
command = "pwsh"
args = ["-NoProfile", "-Command", "$r = & git rev-parse --show-toplevel 2>$null; if ($LASTEXITCODE -ne 0 -or -not $r) { exit 2 }; & (Join-Path $r 'scripts/mcp/pg-server-start.ps1') 'MJ_AGENT_PG_MEMORY_PROD_LAN_URL'; exit $LASTEXITCODE"]
