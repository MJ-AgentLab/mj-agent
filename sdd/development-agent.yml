# Contract: plans/[PLAN]_dual-agent-compat.md §9 (fields/enums) + §4.4 (projection tiers)
#   + D-013 (mcp per-server tiers) + D-014 (skills projection whitelist SoT).
#   schema_version 2 adds the Codex cross-carrier axis — `codex_carrier` +
#   `carrier_binding.workflow_id` + top-level `codex_readme_template_version` — per
#   plans/[PLAN]_codex_cross_carrier_kernel.md §2.1/§2.2.1 + ADR-039 (PR-C1 cutover).
# Validated by: scripts/sdd/check_development_agent.py (V8) +
#   scripts/sdd/check_agents_projection.py (V9); tests in
#   tests/unit/test_sdd_development_agent.py.
# Layering (program plan §7): this file is the DERIVED-INVENTORY layer — it records
#   coverage/approval/evidence for both tools but never redefines policy; canonical rules
#   live in sdd/ + policies/ + capability contracts.
# Change discipline: the `mcp` and `codex.posture` sections, and the v2 carrier axis
#   (`codex_carrier` / `carrier_binding`), are protected-adjacent surfaces (program
#   plan §17 / D-017; anchor `mcp-server-trust-posture-change`) —
#   OWNER_APPROVAL_REQUIRED before modifying them.
# Forbidden by contract: `owner_agent` or any tool-specific fixed-duty field (§9).

