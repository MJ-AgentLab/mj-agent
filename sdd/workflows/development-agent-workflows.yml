    codex_substitute: {kind: inline-procedure, route_ref: route-doc-family-adapter}
  - {id: edge-flow-review-respond-flow-implement, from: mj-agent-flow-review-respond, to: mj-agent-flow-implement, relation: handoff, activation: conditional, closure: advisory}
  - {id: edge-flow-review-respond-flow-verify, from: mj-agent-flow-review-respond, to: mj-agent-flow-verify, relation: handoff, activation: conditional, closure: advisory}
  - id: edge-flow-review-respond-git-check-merge
    from: mj-agent-flow-review-respond
