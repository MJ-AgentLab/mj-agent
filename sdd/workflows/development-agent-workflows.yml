  - {id: edge-flow-post-merge-git-branch, from: mj-agent-flow-post-merge, to: mj-agent-git-branch, relation: call, activation: conditional, closure: carrier-required}
  - {id: edge-flow-post-merge-git-delete, from: mj-agent-flow-post-merge, to: mj-agent-git-delete, relation: call, activation: always, closure: carrier-required}
