    codex_substitute: {kind: owner-manual-route, route_ref: route-runtime-owner-gated, policy_ref: runtime-skill-content-change}
  - {id: edge-flow-self-review-flow-scope-drift, from: mj-agent-flow-self-review, to: mj-agent-flow-scope-drift, relation: call, activation: always, closure: carrier-required}
  - {id: edge-flow-self-review-git-commit, from: mj-agent-flow-self-review, to: mj-agent-git-commit, relation: call, activation: always, closure: carrier-required}
  - {id: edge-flow-self-review-git-push, from: mj-agent-flow-self-review, to: mj-agent-git-push, relation: handoff, activation: conditional, closure: advisory}
  - id: edge-flow-review-respond-doc-sync
    from: mj-agent-flow-review-respond
    to: mj-agent-doc-sync
    relation: handoff
    activation: conditional
