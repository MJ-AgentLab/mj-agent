  - id: edge-doc-validate-doc-author
    from: mj-agent-doc-validate
    to: mj-agent-doc-author
    relation: handoff
    activation: conditional
    closure: advisory
    codex_substitute: {kind: inline-procedure, route_ref: route-doc-family-adapter}
  - {id: edge-flow-intake-git-issue, from: mj-agent-flow-intake, to: mj-agent-git-issue, relation: handoff, activation: conditional, closure: advisory}
