# sdd/workflows/development-agent-workflows.yml — workflow/dependency semantics
# registry for the 13 translated Codex carriers (Epic #499 plan §2.4/§2.5).
#
# DORMANT until the PR-C1 cutover: the real manifest stays schema_version 1 and
# no translated artifact exists on the real tree; this registry is consumed by
# the dormant v2 engine (scripts/sdd/_common/skill_renderer.py) in tests and by
# the PR-P1b production-renderer evidence run.
#
# PROTECTED-ADJACENT (D-017; A14 row (c) typed source — pre-registered at PR-A0).
# OWNER_APPROVAL_REQUIRED before modifying (`declared-contract-change`).
#
# Layering: this file owns WORKFLOW/DEPENDENCY semantics only. Harness-primitive
# disposition (lexicon / interaction sites / transform templates) lives in
# sdd/adapters/codex-skill-translation.yml; neither file duplicates the other —
# translation refers to edges by ID.
#
# Structure (schema_version 1; strict loader refuses tags/aliases/dup keys/extra
# keys — plan §2.8.1):
#   workflows[] — one record per translated capability: workflow_id (unique,
#     carrier_binding.workflow_id target), capability_id (reverse-unique),
#     codex_discovery_summary (single line, <= 1024 UTF-8 bytes — the Codex
#     discovery budget; MUST contain every required_trigger_terms entry; must
#     pass the translation-map lexicon), required_trigger_terms.
#   edges[] — three orthogonal axes per plan §2.5: relation call|handoff|
#     reference; activation always|conditional|owner-gated; closure
#     carrier-required|substitute-required|advisory. Layer-A edges (no
#     source_evidence) MUST be re-derivable from the three scan regions of the
#     `from` source; layer-B edges carry a marker_id/path/marker anchor whose
#     verbatim marker hits the path exactly once. Every edge whose target has
#     no Codex carrier carries a non-empty codex_substitute.
#   routes[] — deterministic substitute/route texts referenced by edges.

schema_version: 1

workflows:
  - workflow_id: doc-validate
    capability_id: mj-agent-doc-validate
    codex_discovery_summary: "Validate mj-agent documentation compliance (A1-A14 + OB1-OB5 wikilink/frontmatter checks) and report per-check PASS/FAIL/WARN/SKIP; use when asked to validate documentation, 检查文档格式, check docs, 文档合规审计; not for authoring documents and not for the Stage 10 command matrix."
    required_trigger_terms: ["validate documentation", "检查文档格式", "check docs"]
  - workflow_id: flow-intake
    capability_id: mj-agent-flow-intake
    codex_discovery_summary: "Stage 0 task intake: convert a raw requirement into an Intake Result with risk level, scope, documentation needs and stop points; use for 评估任务, 需求评估, task intake, turning a vague description into an actionable engineering task; stops before issue creation."
    required_trigger_terms: ["task intake", "需求评估", "评估任务"]
  - workflow_id: flow-plan
    capability_id: mj-agent-flow-plan
    codex_discovery_summary: "Stage 4 plan authoring: produce the complete working-plan body with 任务拆解, execution order, risks, verification and acceptance criteria; use when asked to 写 plan, draft plan, lay out an implementation plan; the body lands on disk only after the Owner approves."
    required_trigger_terms: ["写 plan", "draft plan", "任务拆解"]
  - workflow_id: flow-implement
    capability_id: mj-agent-flow-implement
    codex_discovery_summary: "Stage 8 coding methodology: red-green-refactor TDD, root-cause-first bugfixing, fresh-evidence completion checks and 3-flavor change classification; use when asked to 开始编码, implement a confirmed plan or spec; in-source canonical (B-flavor) edits always stop for Owner approval."
    required_trigger_terms: ["开始编码", "implement", "TDD"]
  - workflow_id: flow-repo-scan
    capability_id: mj-agent-flow-repo-scan
    codex_discovery_summary: "Stage 3 repo scan: systematic 事实核查 of repo state against the issue/plan before coding, producing the Documentation Decision matrix and a plan verdict; use for repo scan, checking whether a plan still holds, stale-doc reverse scan; strictly read-only."
    required_trigger_terms: ["repo scan", "事实核查", "Documentation Decision"]
  - workflow_id: flow-verify
    capability_id: mj-agent-flow-verify
    codex_discovery_summary: "Stage 10 local verification: run the read-only check matrix (lint, types, offline tests, doc validators) and gate side-effect probes behind explicit confirmation; use for 本地验证, local verification, 跑测试 before commit; destructive operations are never auto-run."
    required_trigger_terms: ["本地验证", "local verification", "跑测试"]
  - workflow_id: flow-scope-drift
    capability_id: mj-agent-flow-scope-drift
    codex_discovery_summary: "Stage 9 scope drift check: compare the working diff against the approved plan scope and report per-file alignment with continue/amend/split recommendations; use for scope drift, 范围漂移, drift check during implementation."
    required_trigger_terms: ["scope drift", "范围漂移", "drift check"]
  - workflow_id: flow-self-review
    capability_id: mj-agent-flow-self-review
    codex_discovery_summary: "Stage 11 pre-commit self-review: verify the staged diff against the plan, run the scope-drift sub-check and the 12-item checklist, and draft the commit message; use for AI 自检, self review, commit 前检查; outputs go/no-go and never commits by itself."
    required_trigger_terms: ["AI 自检", "self review", "commit 前检查"]
  - workflow_id: flow-review-respond
    capability_id: mj-agent-flow-review-respond
    codex_discovery_summary: "Stage 15 review response on your own PR: fetch review comments, classify each (bug/suggestion/style/architecture/requirement/test), analyze CI failures, draft fixes and replies; use for 处理 review, respond to review, CI failure 分析; replies post only after Owner approval."
    required_trigger_terms: ["处理 review", "respond to review", "CI failure 分析"]
  - workflow_id: flow-post-merge
    capability_id: mj-agent-flow-post-merge
    codex_discovery_summary: "Stage 17 post-merge cleanup: close the linked issue, update the changelog, open follow-up issues, flip the plan state after Owner approval and trigger branch deletion plus mirror sync; use right after a PR is merged, for post-merge cleanup, PR 合并后收尾."
    required_trigger_terms: ["post-merge", "PR 合并后", "post-merge cleanup"]
  - workflow_id: git-branch
    capability_id: mj-agent-git-branch
    codex_discovery_summary: "Create branches for the bare-repo worktree model: pick the branch type (feature/bugfix/documentation/maintain/hotfix) and generate the worktree add command; use for 创建分支, create branch, starting new work; branches are never created in-place with checkout -b."
    required_trigger_terms: ["创建分支", "create branch", "worktree add"]
  - workflow_id: git-issue
    capability_id: mj-agent-git-issue
    codex_discovery_summary: "Create GitHub issues from the 8 in-repo templates with branch-type routing, urgency check and full body preview; use for 创建issue, create issue, report bug, filing a new task; the create command runs only after explicit confirmation."
    required_trigger_terms: ["创建issue", "create issue", "report bug"]
  - workflow_id: git-pr
    capability_id: mj-agent-git-pr
    codex_discovery_summary: "Create pull requests with the per-branch-type template, an explicit base branch and body-file discipline, including the dual-track self-check; use for 创建PR, create PR, pull request preparation; merge is never executed."
    required_trigger_terms: ["创建PR", "create PR", "pull request"]

