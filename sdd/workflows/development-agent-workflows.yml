    from: mj-agent-flow-implement
    to: mj-agent-flow-diagnose
    relation: call
    activation: conditional
    closure: carrier-required
    source_evidence:
      marker_id: flow-implement-diagnose-delegation
      path: .claude/skills/mj-agent-flow-implement/SKILL.md
      marker: "委派判据（硬 bug / perf / flaky）"
      construct: paragraph
      placement: after-paragraph
  - id: edge-flow-diagnose-infra-studio-probe
    from: mj-agent-flow-diagnose
    to: mj-agent-infra-studio-probe
    relation: reference
    activation: conditional
    closure: advisory
    codex_substitute: {kind: tool-neutral-command, route_ref: route-studio-probe-manual}
    source_evidence:
      marker_id: flow-diagnose-studio-probe-route
      path: .claude/skills/mj-agent-flow-diagnose/SKILL.md
      marker: "Studio repro（`/mj-agent-infra-studio-probe`）"
      construct: table
      placement: after-table

routes:
  - route_id: route-doc-family-adapter
    text: "No native Codex carrier for the doc family: follow the shared documentation semantics (sdd/adapters/development-agent.md + docs/_templates), propose the document body in conversation, obtain Owner approval, then write it and run the repo doc validators."
  - route_id: route-check-merge-owner
    text: "Merge readiness and the merge itself are Owner actions: report CI/review state, stop at AWAITING_HUMAN_MERGE, and never merge."
  - route_id: route-runtime-owner-gated
    text: "In-source canonical runtime surfaces are Owner-gated: propose the exact diff in conversation and stop at OWNER_APPROVAL_REQUIRED (runtime-skill-content-change / prompt-version-or-body-change / biz-catalog-sync per surface); apply only after the Owner approves."
  - route_id: route-studio-probe-manual
    text: "Run the LangGraph Studio probe manually: start `uv run langgraph dev`, execute the H1/H2/H3/R1/R2 probe matrix, and treat the results as advisory evidence."
