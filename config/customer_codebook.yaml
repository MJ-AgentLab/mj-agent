# Customer name → codename mapping (ADR-014 落地, Phase 1 sub 1.C 起草版).
#
# Phase 1: stub format only — codenames are placeholder hashes; the
# "anonymize_customer_names" runtime config is **off** in Phase 1, so this
# file is read but not consulted by the LLM call path. The entity resolver
# (src/mj_agent/entity/resolver.py) joins this codebook into its output so
# Phase 2 can flip on anonymization without changing the resolver API.
#
# Phase 2 (per ADR-014):
#   - Codenames re-randomized to avoid size-rank inference (e.g. CUST_<hash>)
#   - File encrypted at rest; RBAC-controlled access via mj-agent-gateway
#   - LLM Gateway substitutes canonical → codename on outbound; reverses on
#     UI inbound based on user role
#
# Coverage parity: every institution in src/mj_agent/entity/aliases.yaml
# SHOULD have an entry here so the resolver can return a codename when
# anonymization is on. Mismatches are flagged by Phase 2 contract test.

version: "0.1"
schema_revision: 1
anonymization_enabled: false  # Phase 2 flips this via runtime config

mappings:
