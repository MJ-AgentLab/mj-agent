# =============================================
# mj-agent compose stack — BASE (env-agnostic; see ADR-008 + ADR-025)
#
# 4-file layering (mirrors mj-system v3.2.2 docker-compose.{yml,override.yml,test.yml,prod.yml}):
#   docker-compose.mj-agent.yml           — this file (BASE; env-agnostic; total)
#   docker-compose.override.yml           — DEV (`-f` 显式；build + dev profile env)
#   docker-compose.test.yml               — TEST (`-f` 显式；Harbor pull + 8C/12G)
#   docker-compose.prod.yml               — PROD (`-f` 显式；Harbor + 4C/12G + json-file logging)
#
# 注意：因 compose 文件在 infra/docker/ 子目录（非仓根），且全部用 `-f` 显式调用，
#   override.yml **不**会自动加载（docker compose auto-load 仅在 cwd default 调用时触发）。
#   所以 dev 也要显式 chain `-f docker-compose.mj-agent.yml -f docker-compose.override.yml`。
#
# Independent compose project (per ADR-008):
#   - `name: mj-agent` declared below; docker compose creates a dedicated project visible
#     separately in Docker Desktop / Portainer. mj-system's project unaffected.
#   - mj-agent attaches to mj-system's `mj-system-backend-network` as `external: true` to
#     reach biz pg (read-only analyst role). mj-system stack must run first; mj-agent
#     does not own that network's lifecycle.
#   - mj-agent owns its own storage stack (mj-agent-postgres + mj-agent-redis) on a
#     private `mj-agent-storage` bridge — invisible to mj-system, decoupled lifecycle.
#
# Services:
#   mj-agent             chainlit UI + agent runtime
#   mj-agent-postgres    langgraph AsyncPostgresSaver backing store
#   mj-agent-redis       reserved for future use (no Python client wired)
#
# Pre-requisite (TEST/PROD/dev co-location):
#   - mj-system stack running on the SAME host (or at minimum: `mj-system-backend-network`
#     exists and `mj-postgres` is reachable on it). Verify:
#       docker network ls --filter name=mj-system-backend-network
#       docker ps --filter name=mj-system-postgres
#
# Usage — 3 profile entry points (from mj-agent repo root；全部用显式 `-f` 链)：
#   # DEV
#   docker compose --env-file .env -f infra/docker/docker-compose.mj-agent.yml \
#                  -f infra/docker/docker-compose.override.yml up -d
#
#   # TEST (run on 192.168.0.179)
#   docker compose --env-file .env -f infra/docker/docker-compose.mj-agent.yml \
#                  -f infra/docker/docker-compose.test.yml up -d
#
#   # PROD (run on 192.168.0.106)
#   docker compose --env-file .env -f infra/docker/docker-compose.mj-agent.yml \
#                  -f infra/docker/docker-compose.prod.yml up -d
#
# Path resolution:
#   With `-f infra/docker/docker-compose.mj-agent.yml`, project_directory =
#   `infra/docker/`. All relative paths in this file resolve from there:
#     `../../`             = mj-agent repo root
#     `../../.env`         = mj-agent/.env
#     `./postgres-init`    = infra/docker/postgres-init/
#
# Env file (CLI substitution layer):
#   docker compose's `${VAR}` substitution in compose YAML reads `.env` from
#   the project_directory (= `infra/docker/`), NOT the developer's cwd. Since
#   the real .env lives at the repo root, every `docker compose` invocation
#   above passes `--env-file .env` explicitly so the postgres init script
#   sees the real MJ_AGENT_MEMORY_PASSWORD instead of the `:-default` sentinel.
#   The `env_file: ../../.env` directive inside service definitions is a
#   *different* mechanism — it injects vars into the running container, not
#   into the CLI-level `${...}` substitution that runs before the container
#   starts.
#
# Port map (host → container; aligned with mj-system co-location, ADR-008):
#   8001 → 8000   chainlit (avoid mj-app's 8000)
#   5433 → 5432   memory pg (avoid mj-postgres's 5432)
#   6379 → 6379   redis (no clash; mj-system has no redis)
# =============================================

name: mj-agent

services:
  mj-agent:
    # Base image tag (env-agnostic). DEV override.yml adds `build:` to build from Dockerfile;
    # TEST/PROD override files set `image:` to a Harbor-hosted tag.
    image: mj-agent:0.1
    container_name: mj-agent
    hostname: mj-agent
    env_file:
      - ../../.env
    environment:
      # Universal: mj-agent ALWAYS uses its own postgres + redis containers via
      # mj-agent-storage internal network (regardless of profile). Per-profile
      # `POSTGRES_<PROFILE>_HOST` injection lives in override files.
      MJ_AGENT_MEMORY_HOST: mj-agent-postgres
      MJ_AGENT_MEMORY_PORT: "5432"
      MJ_AGENT_REDIS_HOST: mj-agent-redis
      MJ_AGENT_REDIS_PORT: "6379"
      # Universal: bind 0.0.0.0 inside container (host port mapping below
      # decides external exposure).
      CHAINLIT_HOST: 0.0.0.0
      CHAINLIT_PORT: "8000"
    ports:
      - "8001:8000"
    depends_on:
      mj-agent-postgres:
        condition: service_healthy
      mj-agent-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mj-agent", "check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - mj-system-network
      - mj-agent-storage
    labels:
      com.mj-agent.service: "agent"

  # ========================================
  # Memory store — postgres dedicated to langgraph checkpointer
  # ========================================
  mj-agent-postgres:
    # Digest-pinned (PR #52 supply-chain hardening; Dependabot bumps via docker ecosystem).
    image: postgres:18-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    container_name: mj-agent-postgres
    hostname: mj-agent-postgres
    environment:
      # Super-user for the container itself (used by init script + healthcheck).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MJ_AGENT_PG_SUPERUSER_PASSWORD:-local-dev-only-replace}
      # The init script reads these and CREATEs role + database.
      MJ_AGENT_MEMORY_DB: ${MJ_AGENT_MEMORY_DB:-mj_agent_memory}
      MJ_AGENT_MEMORY_USER: ${MJ_AGENT_MEMORY_USER:-mj_agent_app}
      MJ_AGENT_MEMORY_PASSWORD: ${MJ_AGENT_MEMORY_PASSWORD:-local-dev-only-replace-in-prod}
      # PG 18+ Docker images expect the volume to be mounted at the
      # parent /var/lib/postgresql (not /var/lib/postgresql/data) so
      # `pg_upgrade --link` can cross major versions in-place. We keep
      # PGDATA pointing at the conventional /data subdirectory inside
      # the mount so init scripts / dumps / restore docs stay portable
      # against earlier PG majors. See
      # https://github.com/docker-library/postgres/issues/37 + PR #1259.
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Shanghai
    volumes:
      - mj-agent-postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host:5433 → container:5432. 5432 is taken by mj-system's mj-postgres.
      - "5433:5432"
    healthcheck:
      # Use `psql -c 'SELECT 1'` instead of `pg_isready -d <db>` because
      # pg_isready returns 0 as soon as the SERVER accepts connections —
      # it does NOT validate that the named DB actually exists. If the
      # init script fails (or hasn't run yet because PGDATA was already
      # initialized but the role/DB wasn't created), pg_isready greenlights
      # the container, mj-agent's depends_on fires, and mj-agent then dies
      # on `password authentication failed for user "mj_agent_app"`.
      # The psql probe forces server-up + DB-exists + super-user reachable,
      # so failures surface here instead of cascading to mj-agent.
      # Local socket connection uses `trust` per the alpine image's
      # default pg_hba.conf — no password needed.
      # start_period bumped 15s → 30s so the init script (which runs
      # before the server accepts external connections) has time to
      # CREATE ROLE + DATABASE before the first probe lands.
      test: ["CMD-SHELL", "psql -U postgres -d $${MJ_AGENT_MEMORY_DB:-mj_agent_memory} -tc 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - mj-agent-storage
    labels:
      com.mj-agent.service: "memory-postgres"

  # ========================================
  # Redis — reserved for future use (session cache / streaming / rate limit).
  # No Python client is wired in agent code yet; container ships ready.
  # ========================================
  mj-agent-redis:
    # Digest-pinned (PR #52 supply-chain hardening; Dependabot bumps via docker ecosystem).
    image: redis:8-alpine@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1
    container_name: mj-agent-redis
    hostname: mj-agent-redis
    # Optional auth: if MJ_AGENT_REDIS_PASSWORD is set in .env we enable
    # requirepass; otherwise redis runs open on the internal network only
    # (which is acceptable for DEV since the network is bridge-isolated).
    command: >
      sh -c '
        if [ -n "$$MJ_AGENT_REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$MJ_AGENT_REDIS_PASSWORD" --appendonly yes;
        else
          exec redis-server --appendonly yes;
        fi
      '
    environment:
      MJ_AGENT_REDIS_PASSWORD: ${MJ_AGENT_REDIS_PASSWORD:-}
      TZ: Asia/Shanghai
    volumes:
      - mj-agent-redis-data:/data
    ports:
      # Host:6379 → container:6379. mj-system has no redis so no clash.
      - "6379:6379"
    healthcheck:
      # Branch on whether requirepass is enabled — `redis-cli ping` fails
      # with `NOAUTH Authentication required` when the server is started
      # with `--requirepass`. `--no-auth-warning` silences the auth-warning
      # noise on stderr when -a is used.
      test: ["CMD-SHELL", "if [ -z \"$$MJ_AGENT_REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$$MJ_AGENT_REDIS_PASSWORD\" --no-auth-warning ping; fi"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - mj-agent-storage
    labels:
      com.mj-agent.service: "redis"

# ============================================================
# Networks
# ============================================================
networks:
  # External network owned by mj-system; we attach to read biz pg only.
  # Renamed alias from `mj-backend-network` to `mj-system-network` so the
  # cross-project intent is unambiguous when reading this file standalone.
  mj-system-network:
    name: mj-system-backend-network
    external: true
  # Internal-only bridge for mj-agent's own storage stack.
  mj-agent-storage:
    name: mj-agent-storage
    driver: bridge
    labels:
      com.mj-agent.network.type: "storage"
      com.mj-agent.network.isolation: "internal"

# ============================================================
# Volumes (named at compose-spec level → docker creates as `mj-agent-*-data`)
# ============================================================
volumes:
  mj-agent-postgres-data:
    name: mj-agent-postgres-data
    labels:
      com.mj-agent.volume.service: "memory-postgres"
      com.mj-agent.volume.backup: "daily"
  mj-agent-redis-data:
    name: mj-agent-redis-data
    labels:
      com.mj-agent.volume.service: "redis"
      com.mj-agent.volume.backup: "daily"
