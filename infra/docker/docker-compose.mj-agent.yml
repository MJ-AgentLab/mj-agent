# =============================================
# Drop-in service definitions: mj-agent + dedicated storage stack
# (mj-agent-postgres for memory checkpointer; mj-agent-redis reserved
# for future use — session cache / streaming buffer / rate limit).
#
# Usage A — co-deploy with mj-system (recommended for DEV):
#   from mj-system repo root, run:
#     docker compose \
#       -f docker-compose.yml \
#       -f docker-compose.override.yml \
#       -f ../mj-agent/infra/docker/docker-compose.mj-agent.yml \
#       up -d mj-agent
#
#   This brings up mj-agent + mj-agent-postgres + mj-agent-redis on top
#   of the existing mj-system stack (mj-postgres / mj-app / mj-n8n stay
#   as-is). mj-agent reaches:
#     - biz domain via `mj-postgres:5432` on `mj-system-backend-network`
#       (analyst RO; mj-system owns the data)
#     - memory checkpointer via `mj-agent-postgres:5432` on
#       `mj-agent-storage` (mj-agent owns)
#     - redis (future) via `mj-agent-redis:6379` on `mj-agent-storage`
#
# Usage B — standalone (no mj-system):
#   docker run mj-agent + manually export POSTGRES_DEV_HOST. Storage
#   stack only spins biz queries will fail until a real biz pg is
#   reachable. See infra/docker/README.md §Quick start.
#
# Co-deploy notes:
#   - Network `mj-system-backend-network` is created by mj-system compose;
#     declared `external: true` so we attach without ownership.
#   - Network `mj-agent-storage` is internal to this compose — mj-agent
#     storage services have NO biz-domain visibility.
#   - Host port 8001 → container 8000 (mj-system mj-app already owns 8000).
#   - mj-agent-postgres host port 5433 (avoid clash with mj-system mj-postgres
#     on 5432). mj-agent-redis on 6379 (no clash; mj-system has no redis).
#   - Reads .env from mj-agent project root via env_file (keeps secrets out of YAML).
# =============================================

services:
  mj-agent:
    build:
      # Build context = mj-agent project root (relative to this file's location).
      context: ../../
      dockerfile: infra/docker/Dockerfile
    image: mj-agent:0.1
    container_name: mj-agent
    hostname: mj-agent
    env_file:
      # Path relative to *this compose file*. From mj-system repo's working dir
      # the relative path is ../mj-agent/.env once you `-f ../mj-agent/...yml`.
      - ../../.env
    environment:
      # Override .env values for the in-cluster DNS layout.
      # Biz queries → mj-system's pg.
      POSTGRES_DEV_HOST: mj-postgres
      POSTGRES_DEV_PORT: "5432"
      # Memory checkpointer → mj-agent's own pg.
      MJ_AGENT_MEMORY_HOST: mj-agent-postgres
      MJ_AGENT_MEMORY_PORT: "5432"
      # Redis (future) → mj-agent's own redis.
      MJ_AGENT_REDIS_HOST: mj-agent-redis
      MJ_AGENT_REDIS_PORT: "6379"
      CHAINLIT_HOST: 0.0.0.0
      CHAINLIT_PORT: "8000"
    ports:
      - "8001:8000"
    depends_on:
      mj-agent-postgres:
        condition: service_healthy
      mj-agent-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mj-agent", "check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - mj-backend-network
      - mj-agent-storage
    labels:
      com.mj-agent.environment: "development"
      com.mj-agent.service: "agent"

  # ========================================
  # Memory store — postgres dedicated to langgraph checkpointer
  # ========================================
  mj-agent-postgres:
    image: postgres:16-alpine
    container_name: mj-agent-postgres
    hostname: mj-agent-postgres
    environment:
      # Super-user for the container itself (used by init script + healthcheck).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MJ_AGENT_PG_SUPERUSER_PASSWORD:-local-dev-only-replace}
      # The init script reads these and CREATEs role + database.
      MJ_AGENT_MEMORY_DB: ${MJ_AGENT_MEMORY_DB:-mj_agent_memory}
      MJ_AGENT_MEMORY_USER: ${MJ_AGENT_MEMORY_USER:-mj_agent_memory}
      MJ_AGENT_MEMORY_PASSWORD: ${MJ_AGENT_MEMORY_PASSWORD:-local-dev-only-replace-in-prod}
      TZ: Asia/Shanghai
    volumes:
      - mj-agent-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host:5433 → container:5432. 5432 is taken by mj-system's mj-postgres.
      # If running standalone (no mj-system), 5432 → 5432 also works.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${MJ_AGENT_MEMORY_DB:-mj_agent_memory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - mj-agent-storage
    labels:
      com.mj-agent.environment: "development"
      com.mj-agent.service: "memory-postgres"

  # ========================================
  # Redis — reserved for future use (session cache / streaming / rate limit).
  # No Python client is wired in agent code yet; container ships ready.
  # ========================================
  mj-agent-redis:
    image: redis:7-alpine
    container_name: mj-agent-redis
    hostname: mj-agent-redis
    # Optional auth: if MJ_AGENT_REDIS_PASSWORD is set in .env we enable
    # requirepass; otherwise redis runs open on the internal network only
    # (which is acceptable for DEV since the network is bridge-isolated).
    command: >
      sh -c '
        if [ -n "$$MJ_AGENT_REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$MJ_AGENT_REDIS_PASSWORD" --appendonly yes;
        else
          exec redis-server --appendonly yes;
        fi
      '
    environment:
      MJ_AGENT_REDIS_PASSWORD: ${MJ_AGENT_REDIS_PASSWORD:-}
      TZ: Asia/Shanghai
    volumes:
      - mj-agent-redis-data:/data
    ports:
      # Host:6379 → container:6379. mj-system has no redis so no clash.
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - mj-agent-storage
    labels:
      com.mj-agent.environment: "development"
      com.mj-agent.service: "redis"

# ============================================================
# Networks
# ============================================================
networks:
  mj-backend-network:
    name: mj-system-backend-network
    external: true
  mj-agent-storage:
    name: mj-agent-storage
    driver: bridge
    labels:
      com.mj-agent.network.type: "storage"
      com.mj-agent.network.isolation: "internal"

# ============================================================
# Volumes
# ============================================================
volumes:
  mj-agent-postgres-data:
    name: mj-agent-postgres-data
    labels:
      com.mj-agent.volume.service: "memory-postgres"
      com.mj-agent.volume.backup: "daily"
  mj-agent-redis-data:
    name: mj-agent-redis-data
    labels:
      com.mj-agent.volume.service: "redis"
      com.mj-agent.volume.backup: "daily"
