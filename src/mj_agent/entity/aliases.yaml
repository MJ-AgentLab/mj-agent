# Entity dictionary for mj-agent (Phase 1 sub 1.C).
#
# Purpose: map user-typed names (短名 / 别称 / 拼音缩写) → canonical name +
# the runtime DB key (tenant_id / pcat_l1) that the LLM should put into SQL.
#
# Two layers per entity family:
#   L1 exact: query exactly matches one of {canonical, aliases[]}
#   L2 fuzzy: rapidfuzz.process.extract score ≥ FUZZY_THRESHOLD on aliases[]
#
# Phase 1 starter — covers the 10-20 most-asked-about institutions + the
# product families seen in MVP walkthrough trace. Phase 2:
#   - tenant_id filled from biz_dwd.dwd_dim_institution snapshot
#   - alias coverage extended via LangSmith trace miss audit (E8 ≥ 80%)
#   - codename column joins config/customer_codebook.yaml (ADR-014)

