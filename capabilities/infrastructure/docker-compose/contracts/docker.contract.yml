# capabilities/infrastructure/docker-compose/contracts/docker.contract.yml
#
# Covers REQ-003 image-layer constraints (no secrets baked).
# Phase M1 reverse-engineered from infra/docker/Dockerfile + entrypoint.sh.

contract_id: docker
covers_requirements:
  - REQ-003

dockerfile:
  path: docker/Dockerfile
  freeze_anchor: docker/Dockerfile (126 lines)

base_image:
  builder_stage:
    image: python:3.13-slim                       # digest-pinned; #294 re-pin after Dependabot cross-minor 3.14 bump broke the build
    note: "actual Python = 3.13.14 inside digest eb43ff1 (verified 2026-07-07); minor is LOCKED by requires-python >=3.13,<3.14 + UV_PYTHON_PREFERENCE=only-system"
    rationale: "Dependabot may bump the digest ONLY within the 3.13-slim line (semver-major/minor ignore-listed in .github/dependabot.yml per #294); a minor/major jump needs a human PR that also moves requires-python + uv.lock"
  runtime_stage:
    image: python:3.13-slim                       # same digest
    note: "same digest as builder; runtime additions: libpq5 + tini"
  uv_binary:
    image: ghcr.io/astral-sh/uv:0.12.1            # tag + digest pinned inline at docker/Dockerfile:46 (#405)
    note: "builder-only tool image pulled via COPY --from= (not FROM); supplies the uv that runs uv sync to build /app/.venv, which is copied into the runtime image — same blast radius as a base image (per #408)"
    rationale: "pinned inline and deliberately NOT parameterised via a build arg; an ARG would restore the mutability #405 removed. Dependabot cannot refresh a COPY --from= image reference (upstream dependabot-core#5103, open since 2022-05-07; recorded in a325aaf / #405), so this pin is hand-maintained by design"

builder_stage_contract:
  build_args:
    APT_MIRROR_URL:
      default: "mirrors.tuna.tsinghua.edu.cn"     # bare host, no scheme/path; --build-arg override allowed (CI passes deb.debian.org)
      semantics: "apt mirror host; sed-substituted for deb.debian.org in /etc/apt/sources.list.d/debian.sources (both stages — ARG redeclared at docker/Dockerfile:37 / :66, sed at :39-40 / :69-70). Must stay a bare host: that file is deb822, so a full URL yields 'URIs: http://https://.../debian' and breaks apt"
  env:
    UV_PYTHON_PREFERENCE: only-system             # avoid uv-managed Python that doesn't survive COPY --from=builder
  caching_strategy:
    layer_1: "COPY pyproject.toml + uv.lock + README.md → uv sync --frozen --no-dev --no-install-project"
    layer_2: "COPY src/ → uv sync --frozen --no-dev"

runtime_stage_contract:
  user:
    name: appuser
    uid: 1000
    gid: 1000
    non_root: true                                # explicit USER directive; required by REQ-003
  tz: Asia/Shanghai
  init_process: tini                              # entrypoint via /usr/bin/tini -- /app/entrypoint.sh
  exposed_port: 8000                              # Chainlit default; HOST_PORT_MAP via compose 8001:8000
  copied_paths_allowlist:
    - "/app/.venv (from builder)"
    - "/app/src"
    - "/app/pyproject.toml"
    - "/app/README.md"
    - "/app/config"                                # config/secrets.enc NOT decrypted — REQ-003
    - "/app/entrypoint.sh"
  forbidden_in_image:                              # REQ-003 — no secrets baked
    - ".env"
    - "config/secrets.enc"
    - "config/secrets-mcp.enc"
    - "private keys / ssh keys"
    - "API keys (no ARG with sensitive values)"
  env_defaults:                                   # non-sensitive defaults; safe in image
    PYTHONUNBUFFERED: "1"
    PYTHONIOENCODING: utf-8
    PYTHONDONTWRITEBYTECODE: "1"
    PATH: "/app/.venv/bin:$PATH"
    CHAINLIT_HOST: "0.0.0.0"
    CHAINLIT_PORT: "8000"
  mkdir:
    - "/var/lib/mj-agent/charts"                  # MJ_AGENT_CHART_TMPDIR
  entrypoint: ["/usr/bin/tini", "--", "/app/entrypoint.sh"]
  cmd: ["serve"]                                  # default subcommand

healthcheck:
  cmd: "mj-agent check"
  interval: 30s
  timeout: 10s
  start_period: 20s
  retries: 3
  semantics: "provider-aware credential check (no LLM endpoint contact); see data-agent.llm-provider REQ-003"

entrypoint_script:
  path: docker/entrypoint.sh
  freeze_anchor: docker/entrypoint.sh (35 lines)
  shebang_options: "set -Eeuo pipefail"
  subcommand_router:
    - "serve  → exec mj-agent serve \"$@\""
    - "check  → exec mj-agent check \"$@\""
    - "shell  → exec /bin/bash"
    - "*      → exec \"$@\""                       # passthrough (e.g. docker run mj-agent uv run pytest ...)
  contract:
    - "does NOT decrypt config/secrets.enc"        # REQ-003
    - "orchestrator injects secrets via --env-file .env / Compose env / Portainer Stack vars / Docker secrets"

hitl_required:
  - none                                          # Dockerfile / entrypoint.sh changes are infra
                                                  # but docker/compose.prod.yml mods → cross-cap HITL (per policies/docker-runtime.md)

