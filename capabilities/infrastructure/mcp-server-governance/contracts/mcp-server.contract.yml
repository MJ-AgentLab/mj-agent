contract_id: mcp-server
covers_requirements:
- REQ-001
- REQ-002
mcp_inventory_file:
  path: .codex/config.toml
  freeze_anchor: .codex/config.toml
  expected_total_entries: 8
servers:
- name: github
  type: stdio
  invocation: cmd
  trust_posture: first-party
  credential_mode: api_key_via_env
  env_secrets:
  - GITHUB_PERSONAL_ACCESS_TOKEN
  purpose: Issues / PRs / repo browsing
  args:
  - /c
  - npx
  - -y
  - '@modelcontextprotocol/server-github'
  env_vars:
  - GITHUB_PERSONAL_ACCESS_TOKEN
- name: serena
  type: stdio
  invocation: cmd
  trust_posture: third-party
  credential_mode: none
  args:
  - /c
  - uv
  - tool
  - run
  - --from
  - git+https://github.com/oraios/serena
  - serena
  - start-mcp-server
  - --context
  - codex
  - --enable-web-dashboard
  - 'false'
  - --project-from-cwd
  purpose: Symbol-first local project inspection for Codex
  env_vars: []
- name: pg-mj-agent-memory-dev
  type: stdio
  invocation: pwsh
  trust_posture: first-party-wrapper
  credential_mode: wrapped_script_env_name_resolution
  default_url: null
  env_override: MJ_AGENT_PG_MEMORY_DEV_URL
  purpose: DEV mj-agent-postgres memory checkpointer pg
  args:
  - -NoProfile
  - -Command
  - $r = & git rev-parse --show-toplevel 2>$null; if ($LASTEXITCODE -ne 0 -or -not $r) { exit 2 }; & (Join-Path
    $r 'scripts/mcp/pg-server-start.ps1') 'MJ_AGENT_PG_MEMORY_DEV_URL'; exit $LASTEXITCODE
  env_vars:
  - MJ_AGENT_PG_MEMORY_DEV_URL
- name: pg-mj-agent-memory-test-lan
  type: stdio
  invocation: pwsh
  trust_posture: first-party-wrapper
  credential_mode: wrapped_script_env_name_resolution
  default_url: null
  env_override: MJ_AGENT_PG_MEMORY_TEST_LAN_URL
  purpose: LAN access to 192.168.0.179:5433
  args:
  - -NoProfile
  - -Command
  - $r = & git rev-parse --show-toplevel 2>$null; if ($LASTEXITCODE -ne 0 -or -not $r) { exit 2 }; & (Join-Path
    $r 'scripts/mcp/pg-server-start.ps1') 'MJ_AGENT_PG_MEMORY_TEST_LAN_URL'; exit $LASTEXITCODE
  env_vars:
  - MJ_AGENT_PG_MEMORY_TEST_LAN_URL
- name: pg-mj-agent-memory-test-wan
  type: stdio
  invocation: pwsh
  trust_posture: first-party-wrapper
  credential_mode: wrapped_script_env_name_resolution
  default_url: null
  env_override: MJ_AGENT_PG_MEMORY_TEST_WAN_URL
  purpose: WAN/FRP tunnel; env REQUIRED
  args:
  - -NoProfile
  - -Command
  - $r = & git rev-parse --show-toplevel 2>$null; if ($LASTEXITCODE -ne 0 -or -not $r) { exit 2 }; & (Join-Path
    $r 'scripts/mcp/pg-server-start.ps1') 'MJ_AGENT_PG_MEMORY_TEST_WAN_URL'; exit $LASTEXITCODE
  env_vars:
  - MJ_AGENT_PG_MEMORY_TEST_WAN_URL
- name: pg-mj-agent-memory-prod-lan
  type: stdio
  invocation: pwsh
  trust_posture: first-party-wrapper
  credential_mode: wrapped_script_env_name_resolution
  default_url: null
  env_override: MJ_AGENT_PG_MEMORY_PROD_LAN_URL
  purpose: LAN access to 192.168.0.106:5433
  args:
  - -NoProfile
  - -Command
  - $r = & git rev-parse --show-toplevel 2>$null; if ($LASTEXITCODE -ne 0 -or -not $r) { exit 2 }; & (Join-Path
    $r 'scripts/mcp/pg-server-start.ps1') 'MJ_AGENT_PG_MEMORY_PROD_LAN_URL'; exit $LASTEXITCODE
  env_vars:
  - MJ_AGENT_PG_MEMORY_PROD_LAN_URL
- name: pg-mj-agent-memory-prod-wan
  type: stdio
  invocation: pwsh
  trust_posture: first-party-wrapper
  credential_mode: wrapped_script_env_name_resolution
  default_url: null
  env_override: MJ_AGENT_PG_MEMORY_PROD_WAN_URL
  purpose: WAN/FRP
  args:
  - -NoProfile
  - -Command
  - $r = & git rev-parse --show-toplevel 2>$null; if ($LASTEXITCODE -ne 0 -or -not $r) { exit 2 }; & (Join-Path
    $r 'scripts/mcp/pg-server-start.ps1') 'MJ_AGENT_PG_MEMORY_PROD_WAN_URL'; exit $LASTEXITCODE
  env_vars:
  - MJ_AGENT_PG_MEMORY_PROD_WAN_URL
- name: playwright
  type: stdio
  invocation: cmd
  trust_posture: third-party
  credential_mode: none
  purpose: Browser automation for developing + testing the Chainlit web UI (:8000)
  args:
  - /c
  - npx
  - -y
  - '@playwright/mcp@latest'
  env_vars: []
wrapper_script_consistency:
  required_wrapper: scripts/mcp/pg-server-start.ps1
  required_for: all 5 pg-mj-agent-memory-* entries
  implementation: scripts/mcp/pg-server-wrapper.mjs
  historical_baseline: docs/_baselines/pg_server_baseline.md (historical only; native behavior is tested directly)
credential_rules:
  modes:
  - none
  - api_key_via_env
  - wrapped_script_env_name_resolution
  prohibited:
  - literal credential/connection URL in project config
  - business database or ssh MCP entries
  - application-secret import or fallback URL
  - logging secret values
  mandatory:
  - explicit env_vars by name only; missing value fails closed
  - MCP and application credentials remain separate
  - User environment changes require separate Owner-approved execution; no automatic trust or hooks activation
a14_gate:
  trigger: .codex/config.toml or native MCP scripts modified
  required_pr_body_block:
    template_location: contracts/governance.contract.yml §a14_pr_gate.pr_body_required_block (former MCP STANDARD
      §4 archived M6 X5 → archive/rule/[DEPRECATED]_[STANDARD]_MJ_Agent_MCP_Server_Governance_v1_0.md)
    required_fields:
    - server_name
    - trust_posture (one of: first-party / third-party / first-party-wrapper / community)
    - credential_mode (none / api_key_via_env / wrapped_script_env_name_resolution)
    - rationale (for added / changed entries)
  enforcement:
    pr_body: manual_reviewer_check
    owner_approval: required_for_protected_native_mcp_changes
    static_config: scripts/sdd/check_codex_native.py --surface mcp (V11; config only, no PR body parsing)
    pr_body_automation: none
quarterly_audit:
  cycle: 3_months
  dri: ranzuozhou
  tasks:
  - re_evaluate_trust_posture
  - diff_wrapper_script_against_community_pg_mcp
  - check_unmaintained_community_servers (retained native inventory only)
  - update_baseline_if_drift
hitl_required:
- mcp_inventory_change
- wrapper_script_change
permanently_excluded:
- pg-mj-system-biz-*
- ssh-manager
