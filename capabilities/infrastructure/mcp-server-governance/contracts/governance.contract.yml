# capabilities/infrastructure/mcp-server-governance/contracts/governance.contract.yml
#
# A14 PR gate logic + quarterly audit process.
# Phase M1 informational (manual reviewer check); Phase M2 warning; Phase M3 blocking.

contract_id: governance
covers_requirements:
  - REQ-001                                       # A14 PR gate declaration
  - REQ-002                                       # wrapper consistency check

# A14 PR Gate definition
a14_pr_gate:
  meta_framework_ref: "Meta v2.1 §7.7 A14"
  governance_doc: "docs/infrastructure/mcp/[STANDARD]_MJ_Agent_MCP_Server_Governance.md §4"

  trigger_files:
    - .mcp.json
    - .claude/scripts/pg-server-start.cmd
    - .claude/scripts/pg-server-wrapper.mjs

  pr_body_required_block:
    format: |
      ## MCP Server Governance (A14)

      <Per-server table listing each added / removed / changed server with:>

      | Server name | Change | Trust posture | Credential mode | Rationale |
      |---|---|---|---|---|
      | <name> | added/removed/changed | first-party / third-party / first-party-wrapper / community | none / OAuth / api_key_via_env / wrapped_script_url_override | <≥ 1 sentence> |

    minimum_fields:
      - server_name
      - change_type (added | removed | changed)
      - trust_posture
      - credential_mode
      - rationale

  reviewer_action:
    M1: "Reviewer manually checks PR body has block before approving"
    M2: "scripts/sdd/check_a14_gate.py emits CI warning if block missing"
    M3: "scripts/sdd/check_a14_gate.py blocks PR if block missing"

# Quarterly audit process (§6 of MCP STANDARD)
quarterly_audit:
  cycle: every_3_months
  dri: ranzuozhou
  trigger:
    - calendar_quarter_end
    - new_claude_model_release (per A6 review cadence; per policies/documentation.md)

  tasks:
    - id: re_evaluate_trust_posture
      action: |
        For each of 13 servers, check:
        - first-party: still Anthropic-published? (still on Anthropic's MCP server registry)
        - third-party: still maintained? (last commit < 6 months on upstream repo)
        - first-party-wrapper: baseline still aligned with community pg MCP? (diff)
        - community: still maintained? trust posture upgrade/downgrade if needed
      output: "evidence/runtime/<YYYY-Q>_mcp_trust_audit.md"

    - id: diff_wrapper_baseline
      action: |
        diff -u docs/_baselines/pg_server_baseline.md <(community-pg-mcp-fetch-latest)
        If drift detected → file [ISSUE] to refresh baseline or propose wrapper change.
      output: "evidence/runtime/<YYYY-Q>_pg_wrapper_baseline_diff.md"

    - id: check_unmaintained_servers
      action: |
        For each third-party / community server, check upstream last commit + open issues.
        Flag servers with no commits in 6+ months for review.
      output: "evidence/runtime/<YYYY-Q>_unmaintained_check.md"

    - id: check_secret_sentinel_overrides
      action: |
        Verify setup-mcp-secrets.ps1 still populates all 6 sentinel env overrides
        + 4 WAN URL overrides correctly. Test on a clean .env baseline.
      output: "evidence/security/<YYYY-Q>_secret_override_validation.md"

# Cross-capability governance touchpoints
cross_capability_governance:
  with_docker_compose:
    sync_point: "compose-deployed pg endpoint host/port matrix"
    action: "if compose changes pg port (e.g. 5433 → 5434), update .mcp.json + URL env names"
    coordination: "single PR touching both .mcp.json + compose YAML triggers A14 + prod compose HITL"

  with_llm_provider:
    sync_point: "DGX-Spark host (192.168.0.189) appears in both ssh-manager + llm_base_url"
    action: "if DGX host moves, update both ssh-manager env + llm-provider docs"
    coordination: "cross-cap PR touches both"

  with_secrets_pipeline:                          # Phase 2+ capability
    sync_point: "secrets-mcp.enc bundle (per ADR-030) decrypts to OS env vars"
    action: "setup-mcp-secrets.ps1 must populate all env vars referenced in .mcp.json"
    coordination: "secrets-pipeline owns bundle decryption; this capability owns .mcp.json consumption"

hitl_required:
  - mcp_inventory_change                          # any .mcp.json modification
  - wrapper_script_change                         # baseline-tracked
  - quarterly_audit_lapse                         # if cycle missed by > 1 month, escalate

