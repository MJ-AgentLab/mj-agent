contract_id: governance
covers_requirements:
- REQ-001
- REQ-002
a14_pr_gate:
  meta_framework_ref: Meta v2.1 §7.7 A14
  governance_doc: this capability (contracts/governance.contract.yml §a14_pr_gate + design.md); former STANDARD
    §4 archived → archive/rule/[DEPRECATED]_[STANDARD]_MJ_Agent_MCP_Server_Governance_v1_0.md
  trigger_files:
  - .codex/config.toml
  - scripts/mcp/pg-server-start.ps1
  - scripts/mcp/pg-server-wrapper.mjs
  - scripts/mcp/setup-mcp-secrets.ps1
  pr_body_required_block:
    format: '## MCP Server Governance (A14)


      ### Added / removed / changed server entries


      | Server name | Change | Trust posture | Credential mode | Rationale |

      |---|---|---|---|---|

      | <name> | added/removed/changed | first-party / third-party / first-party-wrapper / community | none / OAuth
      / api_key_via_env / wrapped_script_env_name_resolution | <≥ 1 sentence> |


      ### Trust posture changes


      - any third-party → community downgrade → linked issue / mitigation

      - any new community-tier server → upstream URL + last-commit date + 3-commit review summary


      ### Credential safety review


      - [ ] no plaintext credential written into .codex/config.toml

      - [ ] env_vars contains only approved variable names; no application env import

      - [ ] wrapper script (if any) Read-verified to contain no hard-coded credential

      '
    minimum_fields:
    - server_name
    - change_type (added | removed | changed)
    - trust_posture
    - credential_mode
    - rationale
    - trust_posture_change_declaration (downgrade → issue/mitigation; new community → upstream URL + last-commit
      + 3-commit review)
    - credential_safety_checklist (no literal value / approved env_vars names / no hard-coded credential)
  reviewer_action:
    M1: Reviewer manually checks PR body has block before approving
    M2: scripts/sdd/check_a14_gate.py emits CI warning if block missing
    M3: scripts/sdd/check_a14_gate.py blocks PR if block missing
trust_posture_downgrade:
  third_party_to_community:
  - trigger: maintainer_unreachable
    condition: no upstream commit in 90 days
    action: downgrade third-party → community; open PR review
  - trigger: security_issue_unresponsive
    condition: reported security issue with no maintainer response in 30 days
    action: downgrade third-party → community; open PR review
  community_tier_requirement: review scripts/mcp wrapper and upstream separately; no trust escalation by migration
quarterly_audit:
  cycle: every_3_months
  dri: ranzuozhou
  trigger:
  - calendar_quarter_end
  - new_codex_model_release (manual review; no automatic activation)
  tasks:
  - id: re_evaluate_trust_posture
    action: For each of the eight native inventory entries, review publisher ownership, upstream maintenance and
      declared trust posture. This migration does not attest current upstream/service health.
    output: evidence/runtime/<YYYY-Q>_mcp_trust_audit.md
  - id: diff_wrapper_baseline
    action: Review scripts/mcp/pg-server-wrapper.mjs behavior and public upstream changes; keep the historical baseline
      as provenance, not a second maintained implementation.
    output: evidence/runtime/<YYYY-Q>_pg_wrapper_baseline_diff.md
  - id: check_unmaintained_servers
    action: 'For each third-party / community server, check upstream last commit + open issues.

      Flag servers with no commits in 6+ months for review.

      '
    output: evidence/runtime/<YYYY-Q>_unmaintained_check.md
  - id: check_secret_sentinel_overrides
    action: Use synthetic isolated tests to verify only the six approved names are accepted and values are never
      printed. Actual platform credential setup requires separate approval and evidence.
    output: evidence/security/<YYYY-Q>_secret_override_validation.md
cross_capability_governance:
  with_docker_compose:
    sync_point: memory endpoints only
    action: review native config by-name mappings when memory host/port changes
    coordination: A14 and production compose HITL remain independent requirements
  with_secrets_pipeline:
    sync_point: MCP bundle versus application bundle isolation
    action: scripts/mcp/setup-mcp-secrets.ps1 accepts only approved native names
    coordination: decryption/User env writes separately authorized; never auto-run in migration checks
hitl_required:
- mcp_inventory_change
- wrapper_script_change
- quarterly_audit_lapse
