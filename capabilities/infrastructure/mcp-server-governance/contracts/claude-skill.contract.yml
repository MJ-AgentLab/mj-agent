# capabilities/infrastructure/mcp-server-governance/contracts/claude-skill.contract.yml
#
# Claude Code SKILL contract — freezes 6 .claude/skills/mj-agent-infra-*/SKILL.md
# in-tree workflow SKILLs (infra family) per sdd/adapters/claude-code-skill.md §Standards.
#
# Empirical reality (Stage C batch 2 pre-outline reverify; commit 03f1bc7):
# 34/34 .claude/skills/ SKILLs ARE ADR-013 native 2-field schema compliant (zero deviation);
# Stage A V4 false claim "34/34 markdown-body-only" under investigation per
# M3-FU-V4-VALIDATOR-INVESTIGATE.
#
# Schema design (Option B per HITL Gate-1 batch 2):
# - description: stored as description_hash (sha256 of UTF-8 description string) for drift
#   detection without prose in contract YAML (same pattern as body content_hash precedent)
# - body_section_heads: enumerated for structural drift detection
# - content_hash canonical algorithm: strip frontmatter via regex + LF normalize + SHA-256 UTF-8;
#   see safe-sql/runtime-skill.contract.yml header for full canonical spec.
# - M6 freeze-refresh (2026-06-08): all 6 skills re-frozen via the documented canonical
#   algorithm above on CURRENT content (regex strip `(?ms)^---\r?\n.*?\r?\n---\r?\n` count=1 +
#   LF-normalize \r\n & lone \r -> \n + SHA-256). This SUPERSEDES the 2026-06-03 values, which
#   were produced by a now-lost process and had drifted (M5-PR2/PR3a + M6 X2/X4 edited bodies
#   without re-freezing). Hashes are now REPRODUCIBLE: re-running the algorithm on the current
#   SKILL.md files matches the recorded values. Trigger: the M6 freeze-refresh batch re-pointed
#   the dangling archived-doc refs (HITL_Prompt -> sdd/workflows/execution-loop; dev_deployment
#   -> docker-compose capability runbook; walkthrough_evidence -> safe-sql evidence path) in the
#   6 infra SKILL bodies (HITL-authorized; descriptions untouched). No CI gate reads these (V4 is
#   Mode-A schema-lint only; Mode B withdrawn per M4-FU-V4-MODE-B-IMPL) — HITL drift record per
#   policies/ai-agent §7.
# - DGX consumer-side PR-A re-freeze (2026-06-11): mj-agent-infra-llm-endpoint-probe re-frozen
#   via the same canonical algorithm after the Step 3b tool-calling smoke enhancement
#   (3-step -> 4-step; description + body both changed; body_section_heads unchanged;
#   HITL-authorized per vault [PLAN]_mj-agent_DGX_Consumer_Side_Execution v1.1 §1).

