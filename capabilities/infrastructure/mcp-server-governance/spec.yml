id: infrastructure.mcp-server-governance
name: MCP Server Inventory + Governance (ADR-028)
domain: infrastructure
lifecycle_state: drafting
archive_state: active
adapter_coverage:
- development-skill
- tdd-bdd
last_verified: 2026-05-20
owner: ranzuozhou
created: 2026-05-20
updated: 2026-05-20
summary: 'Native Codex config declares exactly eight existing project services: GitHub, Playwright, Serena and five
  memory PG entries. Business PG and ssh-manager are permanently excluded. A14 Owner review, by-name credential
  isolation and fail-closed wrappers remain required. Static checks are not host or service verification.'
requirements:
- id: REQ-001
  statement: .codex/config.toml SHALL declare only the eight retained project services, with trust posture and credential
    mode recorded in contracts/mcp-server.contract.yml; each change requires the A14 declaration and Owner review.
  rationale: Direct native ownership preserves the existing trust and credential boundary without importing another
    client or user services.
  priority: medium
  bdd:
    examples:
    - Given native project config / When inspected offline / Then the exact eight services and A14 declaration template
      exist; no service is started.
- id: REQ-002
  statement: All five memory PG entries SHALL use scripts/mcp/pg-server-start.ps1 and the matching env_vars name,
    without literal values or defaults. Wrapper deviation requires A14 review.
  rationale: One native wrapper preserves fail-closed credential handling and value-free errors; real service execution
    remains separate.
  priority: medium
  bdd:
    examples:
    - Given native project config / When wrappers are inspected / Then five memory PG entries use the canonical
      wrapper and by-name allowlist.
related_decisions:
- decisions/ADR-028_MCP_Server_Inventory_And_Governance.md
- decisions/ADR-030_Secrets_Bundle_Split_For_MCP_Isolation.md
- decisions/ADR-031_Spec_Anchored_Refactor.md
- decisions/ADR-040_Codex_Only_Development.md
cross_capability_refs:
- target: infrastructure.docker-compose
  direction: inbound
  surface: .codex/config.toml memory entries and docker/compose.*.yml memory services
  reason: Only memory PG endpoints are included; business data remains behind the runtime tool chain.
