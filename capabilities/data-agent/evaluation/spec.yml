# Synthetic software only; actual/target acceptance deferred.
id: data-agent.evaluation
name: Offline Runtime Observation Replay and EVAL Reporting
domain: data-agent
lifecycle_state: idea
archive_state: active
adapter_coverage:
- python
- tdd-bdd
last_verified: null
owner: ranzuozhou
created: 2026-10-12
updated: 2026-10-12
summary: '#582新增T-007c Windows synthetic-only来源检查CLI本地候选，复用原inspect_source及保护后端，单JSON退出3；非法输入无输出。原bytes与独立Agent合成验收不认证来源/target，UNVERIFIED/NOT_CHECKED/null/false保持；actual和Linux/macOS原生保护延期，idea/null。'
requirements:
- id: REQ-001
  statement: 读取版本化配置、dataset、观测、manifest 和静态参考，校验输入身份与来源
  rationale: 使每个离线结论绑定可追踪输入，避免来源或版本错配
  priority: high
  bdd:
    examples:
    - Given 22 条 dataset 和缺少 HP-01 的观测 / When 离线回放 / Then 仍输出 22 条 case 结果且 HP-01
      为 NOT_RUN
    - Given dataset 摘要不匹配 manifest / When 校验输入 / Then INPUT_INVALID 且正式指标未测
    - Given 提供记录结构/身份/hash齐全但来源引用虚构 / When inspect_source / Then 来源及target仍UNVERIFIED、审阅覆盖NOT_CHECKED
    - Given actual来源标签 / When synthetic来源检查CLI / Then 只读manifest后退出2且其他输入及输出不可达
- id: REQ-002
  statement: '支持 #161 的 28 个输出检查字段和 4 类轨迹检查，规则与角色审阅明确分工'
  rationale: 覆盖全部 22 条用例且不以关键词代替语义评判
  priority: high
  bdd:
    examples:
    - Given 合成 SQL 正确但窗口披露缺少绑定观测的 Agent 角色审阅 / When 评判 / Then disclosure_required
      为 REVIEW_REQUIRED
    - Given 未知检查字段 / When 评判 / Then 为 UNSUPPORTED 而不是静默跳过
- id: REQ-003
  statement: 保留首次 execute_sql 参数、顺序、结果与错误回环，不以最终成功替代首次失败
  rationale: 防止错误自纠轨迹被误报为首轮命中
  priority: critical
  bdd:
    examples:
    - Given 首次 SQL 缺谓词并返回 require_time_range、第二次修正成功 / When 回放 / Then 首次检查 FAIL 且两次尝试均留在报告
- id: REQ-004
  statement: 输出完整性计数和总体/红线指标，仅对兼容实测基线计算回归
  rationale: '保持 #161 的阈值并隔离未测、无基线与条件不兼容'
  priority: high
  bdd:
    examples:
    - Given 完整实测结果但无基线 / When 回放 / Then measurement 为 MEASURED、regression 为 NO_BASELINE
    - Given 红线存在确认失败且缺基线 / When 回放 / Then safety 为 HARD_FAIL 并优先返回硬失败退出码
- id: REQ-005
  statement: 缺观测、待审、不支持、placeholder 和 fixture-only 均不生成伪通过或虚假基线
  rationale: 不让缺口或测试样例稀释完整 suite 的分母
  priority: critical
  bdd:
    examples:
    - Given 全部观测缺失 / When 回放 / Then 22 条 NOT_RUN、metric 为 null、regression 为 NOT_EVALUATED
    - Given synthetic fixture 全部通过 / When 回放 / Then 测试结果可展示但 runtime metric 为 null
      且不能作为基线
    - Given 缺HP-01观测但其提供review存在 / When inspect_source / Then 列出缺观测及关联缺口，不生成runtime指标或基线
    - Given 合法缺观测结构或结构INVALID / When 来源检查CLI / Then 前者单JSON/3且保留分母、后者2无输出
- id: REQ-006
  statement: 只读显式批准的脱敏本地输入，不加载应用配置、dotenv、凭据或连接 LLM/数据库
  rationale: 保持数据边界和既有离线测试执行路线
  priority: critical
  bdd:
    examples:
    - Given 受控离线测试拒绝应用配置导入、秘密文件访问和网络连接 / When CLI 回放固定样例 / Then 无上述访问且输出正常离线报告
    - Given 文件/应用/网络哨兵 / When inspect_source消费显式bytes / Then 不解析引用或触发IO、服务、replay或judge
