# #582 public core and synthetic-only offline CLI.
# Core remains in-memory; runner owns local fixture IO; actual file entry is deferred.
contract_id: python
adapter: python
covers_requirements:
  - REQ-001
  - REQ-002
  - REQ-003
  - REQ-004
  - REQ-005
  - REQ-006
modules:
  - path: src.mj_agent.evaluation.schema
    freeze_anchor: src/mj_agent/evaluation/schema.py
    exports:
      - name: ReplayInputs
        kind: dataclass
        fields:
          - "config: bytes"
          - "dataset: bytes"
          - "observations: bytes"
          - "manifest: bytes"
          - "reference: bytes"
          - "reviews: bytes = b''"
          - "baseline: bytes = b''"
        public: true
  - path: src.mj_agent.evaluation.core
    freeze_anchor: src/mj_agent/evaluation/core.py
    exports:
      - name: replay
        signature: "def replay(inputs: ReplayInputs) -> dict[str, Any]"
        public: true
    public_invariants:
      - "只消费显式bytes并返回离线报告；不读写文件、不加载应用配置或连接外部服务"
      - "所有dataset case有结果，未知检查不静默跳过，首次尝试与错误轨迹保留"
      - "逐case和逐check状态不掩盖缺口；synthetic fixture不产生runtime baseline"
      - "报告遵循design的完整性、严格窗口、兼容性、精确阈值与退出分类"
      - "合成验收由Agent模拟角色并独立核验，来源和审阅链可追踪，不要求真人参与"
      - "相同输入的规范化JSON、Markdown和退出分类一致"
  - path: src.mj_agent.evaluation.runner
    freeze_anchor: src/mj_agent/evaluation/runner.py
    exports:
      - name: main
        signature: "def main(argv: list[str] | None = None, *, repo_root: Path | None = None) -> int"
        public: true
    public_invariants:
      - "仅显式synthetic模式和synthetic_fixture manifest可进入文件回放；runtime_observation在其他输入读取与核心调用前返回2/ACTUAL_ENTRY_DEFERRED"
      - "所有输入输出受repo_root边界约束，拒绝秘密/网络/设备/软硬链接/重解析点/路径替换；无法可靠验证的平台能力返回2，不降级读取"
      - "只读取明确指定的本地文件原bytes，每输入不超过10MiB；不扫描目录、不读取输入引用或应用配置"
      - "只在新目录exclusive-create报告，不覆盖输入或历史报告；两份写完关闭才返回核心分类，IO失败返回2并保留部分目录"
      - "synthetic全通过仍为SELFTEST_ONLY且退出3，确认红线失败退出6；参数/来源/路径/IO无效退出2；help0不代表EVAL通过"
      - "同输入到不同新目录的UTF-8/LF JSON和Markdown字节与分类一致；不插当前时间/输出路径/随机ID，错误不回显原始argv/载荷/异常"
non_actions:
  - module: src.mj_agent.evaluation.core
    items:
      - "不采样、不执行输入SQL、不导入agent/tools/config/LLM/DB"
      - "不改既有runtime、dataset、其他capability契约、CI gate或waiver"
      - "core不承担CLI文件路径与输出保护；actual入口/采样仍延期"
  - module: src.mj_agent.evaluation.schema
    items:
      - "ReplayInputs只存显式bytes，不解析路径或自动读取文件"
  - module: src.mj_agent.evaluation.runner
    items:
      - "不接受actual/runtime_observation或baseline文件参数，不采样、不执行SQL、不连接LLM/DB/网络服务"
      - "不接入既有server/agent/tool/Studio/Chainlit，不读取dotenv/凭据，不新增profile/env fallback或依赖"
      - "不放宽核心窗口/阈值/审阅/来源约束，不将synthetic当runtime基线，不覆盖或自动删除输出"
hitl_required:
  - declared-contract-change
