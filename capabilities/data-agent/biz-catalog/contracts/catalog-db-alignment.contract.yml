#     no longer take a live_db gate at all. They run offline against synthetic snapshot
#     fixtures and are green in CI (previously they always skipped).
#   - the documented_test_drift block claiming mj-ddd-semantics is "NOT in current
#     _ACTIVE_SKILLS" was FALSE and has been removed: src/mj_agent/agent.py:_ACTIVE_SKILLS
#     does list mj-ddd-semantics. T-005 was tracking a non-existent defect.
