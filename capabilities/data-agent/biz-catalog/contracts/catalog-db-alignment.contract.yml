# capabilities/data-agent/biz-catalog/contracts/catalog-db-alignment.contract.yml
#
# Covers REQ-002 (catalog ↔ DB alignment) + REQ-003 (SKILL ↔ catalog coherence).
# Phase M1 reverse-engineered from tests/contract/test_qcm_catalog_alignment.py +
# tests/contract/test_biz_schema_alignment.py.

contract_id: catalog-db-alignment
covers_requirements:
  - REQ-002                                       # catalog vs DB
  - REQ-003                                       # SKILL vs catalog

# REQ-002 — Catalog ↔ DB alignment rules
db_alignment:
  freeze_anchor: tests/contract/test_qcm_catalog_alignment.py
  live_db_required: false                         # offline since #499 PR-0c: verified against an
                                                  # Owner-attested sanitized snapshot, never a live DB

  rules:
    - rule_id: signal_tables_exist
      description: "Every catalog signal_tables[].name resolves to an analyst-visible biz_dws table"
      verification: "lookup in snapshot payload.schemas.biz_dws.tables for each catalog.signal_tables[].name (offline)"
      current_expected:
        - biz_dws.dws_qcm_preprocessed_data
        - biz_dws.dws_qcm_etl_metrics
        - biz_dws.dws_qcm_ready_signal

    - rule_id: dimension_tables_exist
      description: "Every catalog dimension_tables[].name resolves to an analyst-visible biz_dwd table; join_key column exists"
      verification: "lookup join_key in snapshot payload.schemas.biz_dwd.tables[<name>].columns (offline)"
      current_expected:
        - biz_dwd.dwd_dim_product_interface (join_key: product_interface_id)
        - biz_dwd.dwd_dim_institution (join_key: tenant_id)

    - rule_id: time_columns_resolve
      description: "For each catalog.periods[k].time_column, exists on at least one matching <metric>_<period>_total fact table"
      verification: "per-period lookup of time_column in snapshot payload.schemas.biz_dws.tables[dws_qcm_*_<period>_total].columns (offline)"
      current_expected:
        daily: data_date (resolves on dws_qcm_qrynum_daily_total etc.)
        weekly: week
        monthly: month
        quarterly: quarter
        yearly: year

    - rule_id: forbidden_schemas_not_visible
      description: "Schemas listed in catalog.forbidden_access.schemas do NOT appear in a sanctioned sanitized snapshot"
      verification: "assert snapshot payload.schemas has no key in catalog.forbidden_access.schemas (offline)"
      current_expected: "5 schemas (biz_ods / biz_ads / ops_* — see catalog forbidden_access.schemas)"

  drift_detection:
    detector: tests/contract/test_qcm_catalog_alignment.py
    fixture: synthetic snapshot under tests/contract/fixtures/biz_snapshots/ (no credential gate)
    failure_mode: "test fails → catalog or DB has drifted; manual triage via /mj-agent-runtime-biz-catalog-sync skill"

# REQ-003 — SKILL ↔ catalog coherence
skill_alignment:
  freeze_anchor: tests/contract/test_biz_schema_alignment.py
  live_db_required: false                         # offline since #499 PR-0c

  active_skills:                                  # per agent.py:_ACTIVE_SKILLS
    - path: src/mj_agent/skills/biz-domain-context/SKILL.md
      type: skill
      version: 0.1
      state: active
      track: agent
      frontmatter_only: true                      # body not read (HITL prompt-version-bump avoidance)

    - path: src/mj_agent/skills/qcm-analysis/SKILL.md
      type: skill
      version: 0.1
      state: active
      track: agent
      frontmatter_only: true

    - path: src/mj_agent/skills/safe-sql-analysis/SKILL.md
      type: skill
      version: 0.2
      state: active
      track: agent
      frontmatter_only: true

  rules:
    - rule_id: skill_table_refs_resolve
      description: "Every biz_dws.* / biz_dwd.* table name referenced in SKILL.md body resolves in the sanitized snapshot payload"
      extraction: "regex `(biz_dws|biz_dwd)\\.[a-z_]+` over SKILL body"
      verification: "lookup in snapshot payload.schemas[<schema>].tables (offline; no DB query since Epic #499 PR-0c)"

    - rule_id: skill_metric_columns_resolve
      description: "Daily / monthly metric column patterns documented in catalog resolve to actual columns"
      extraction: "catalog.metric_column_shapes[period].primary / examples"
      verification: "lookup in snapshot payload.schemas[<schema>].tables[<table>].columns (offline; no DB query since Epic #499 PR-0c)"

hitl_required:
  - biz-catalog-sync                              # any change to qcm_catalog.yaml
  - runtime-skill-content-change                  # changing SKILL.md body would break this contract

cross_capability_dependencies:
  - target: data-agent.safe-sql
    rule_link: time_columns_resolve              # catalog.periods.*.time_column → safe-sql REQ-002 require_time_range

# Resolved at Epic #499 PR-0c:
