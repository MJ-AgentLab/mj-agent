      # rejection is covered by the bdd binding above (real step implementation).
    tasks:
      - tasks.md#T-002
    prs:
      - "PR-M1-1"
    evidence:
      - "tests/bdd binding green in CI; evidence harness → Phase-2 (EVAL)"

  - req: REQ-002                                  # Catalog ↔ DB alignment
