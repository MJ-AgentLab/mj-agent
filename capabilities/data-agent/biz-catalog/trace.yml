capability: data-agent.biz-catalog
generated: 2026-05-20
schema_version: "1.2"

# Cross-capability refs (R-G7 cap ≤ 5; here: 2)
cross_capability_refs:
  - target: data-agent.safe-sql
    direction: inbound                            # safe-sql depends on us
    surface: "src/mj_agent/biz_catalog/qcm_catalog.yaml (periods.*.time_column) + src/mj_agent/tools/sql/precheck.py:58-59"
    rationale: "safe-sql REQ-002 require_time_range rule reads our catalog's periods.*.time_column to determine what time predicate columns are valid for biz_dws fact tables"
    impact: "if our catalog drops a period or renames a time_column, safe-sql REQ-002 BDD scenario starts rejecting valid queries"

  - target: data-agent.tool-chain
    direction: outbound                            # we depend on tool-chain (Phase 2+)
    surface: "src/mj_agent/agent.py:ALL_TOOLS + src/mj_agent/biz_catalog/finder.py (find_biz_context registered as tool)"
    rationale: "find_biz_context is a LangChain tool; tool schema contract owned by Phase 2+ tool-chain capability"
    impact: "future tool-chain capability spec changes may require finder.py signature adjustments"

links:

  - req: REQ-001                                  # Schema completeness
    bdd:
      feature: contracts/behavior.feature
      scenarios:
        - "load_catalog rejects YAML whose root parses to a list (not a mapping)"
      automation_status: automated                # M3 Stage B pytest-bdd binding; green in CI (tests/bdd blocking)
