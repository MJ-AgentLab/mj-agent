[project]
name = "mj-agent"
version = "0.1.0"
description = "MJ-AgentLab data agent — Phase 0 Foundation"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "MJ-AgentLab" },
]
dependencies = [
    "langchain==1.2.*",
    "langgraph==1.1.8",
    "langchain-openai>=1.0,<2",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langsmith = ["langsmith>=0.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "langgraph-cli[inmem]>=0.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mj_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: end-to-end tests hitting live biz domain and LLM (disabled by default)",
]
addopts = "-ra --strict-markers -m 'not smoke'"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle + pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["src/mj_agent"]

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
